name: Inject button colors

on:
  push:
    paths:
      - 'button-colors-only.js'
      - '.github/workflows/inject-button-colors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add colors script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./button-colors-only.js?v=4"></script>'
          pattern = r'<script\s+src=["\']\./button-colors-only\.js(?:\?[^"\']*)?["\']\s*></script>'
          if re.search(pattern, s):
              s = re.sub(pattern, tag, s, count=1)
          else:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('index.html missing </head>')
              s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh ACROW button colors script'
          git push
# v4 cache refresh
