name: Fix production script placement
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'kareemabdou07-rgb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place production script correctly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./production-fix.js"></script>'
          s=s.replace(tag+'\n','').replace(tag,'')
          marker='</body>'
          if marker not in s:
              raise SystemExit('body end not found')
          head, tail = s.rsplit(marker, 1)
          s=head+tag+'\n'+marker+tail
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix production button script placement"
          git push
