<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACROW Factory 5 - النظام الموحد</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172536;font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{background:#075ca8;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}.brand{font-size:24px;font-weight:900}.clock{text-align:left;font-size:13px}.wrap{max-width:1250px;margin:auto;padding:16px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.btn{background:#0866b6;color:#fff;border-radius:8px;padding:11px 16px;font-weight:700}.btn.active,.btn:active{background:#f1c40f;color:#111}.btn.gray{background:#526170}.btn.red{background:#b93232}.panel{background:#fff;border:1px solid #d5dee8;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000b}.title{font-size:20px;font-weight:800;margin:0 0 12px}.sub{color:#657586;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{border:1px solid #c9d5e1;border-radius:7px;padding:9px;background:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#f8fafc;border:1px solid #d7e0e8;border-radius:10px;padding:14px}.num{font-size:26px;font-weight:900}.machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}.machine{border:1px solid #cdd8e3;border-radius:9px;padding:12px;background:#fff}.machine.done{background:#d8f4e4;border-color:#4caf76}.machine .mname{font-weight:800}.machine .stat{font-size:12px;color:#687787;margin-top:5px}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{border-bottom:1px solid #e1e7ed;padding:8px;text-align:right;white-space:nowrap}.tbl th{background:#f3f6f9}.hide{display:none!important}.notice{padding:10px;border-radius:8px;background:#fff6d8;border:1px solid #ead27b}.ok{padding:10px;border-radius:8px;background:#e4f7eb;border:1px solid #a7d7b7}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f1f9,#fff)}.loginbox{width:min(440px,92vw);background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0002;text-align:center}.logo{font-size:42px;font-weight:1000;color:#075ca8;letter-spacing:2px}.small{font-size:12px;color:#6a7887}.toast{position:fixed;bottom:20px;left:20px;background:#172536;color:#fff;padding:12px 18px;border-radius:8px;display:none;z-index:50}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
'use strict';
const firebaseConfig={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const ref=db.collection('acrowFactory5').doc('store');
const roles={maintenance:'130150',leader:'588855',dashboard:'205080',settings:'180120',executive:'226622'};
const roleNames={maintenance:'إدارة الصيانة',leader:'قائد فريق إنتاج',dashboard:'لوحة الإدارة',settings:'إعدادات معادلات التقارير',executive:'الإدارة العليا'};
const defaultMachines=['1712 منشار RSA','982 متقاب/مثقاب','263 مثقاب','882 مثقاب','1522 Ledgers/Ring','999 Ledgers/Ring','5004 Ledgers/Ring','5003 Ledgers/Ring','1521 Ledgers/Ring','998 Ledgers/Ring','997 Ring Vertical','996 Ring Vertical','5006 Ring Vertical','5005 Cup Lock Vertical','450 Cup Lock Vertical','1524 Cup Lock Vertical','1523 Cup Lock Vertical','402 Hand welding','455 Hand welding','118 Hand welding','116 Hand welding','404 Hand welding','1502 منطقة الفرز'];
let store={machines:defaultMachines,records:{},faults:[],maintenance:[],obstacles:[],plans:{},settings:{targetPerHour:1,workingHours:8}};let currentUser='';let unsub=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function today(){return new Date().toISOString().slice(0,10)}
function now(){return new Date().toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'medium'})}
function save(){return ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>{console.error(e);toast('تعذر الحفظ السحابي')})}
function roleGate(role){if(currentUser==='executive'||currentUser===role)return true;const p=prompt('أدخل كلمة مرور '+roleNames[role]);if(p===roles[role]){currentUser=role;return true}toast('كلمة المرور غير صحيحة');return false}
function shell(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand">ACROW Factory 5</div><div class="clock"><div>مصنع 5 - وادي حوف</div><div id="clock">${now()}</div></div></header><main class="wrap"><div class="bar"><button class="btn" onclick="page('home')">الرئيسية</button><button class="btn" onclick="page('production')">تسجيل الإنتاج الوردية الأولى</button><button class="btn" onclick="page('production2')">تسجيل الإنتاج الوردية الثانية</button><button class="btn" onclick="page('plan')">الخطة الشهرية</button><button class="btn" onclick="page('reports')">طباعة التقارير</button><button class="btn" onclick="page('maintenance')">الصيانة</button><button class="btn" onclick="page('obstacles')">معوقات الإنتاج</button><button class="btn" onclick="page('dashboard')">لوحة الإدارة</button><button class="btn" onclick="page('settings')">تعديل</button></div><section id="content"></section></main>`;setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=now()},1000);page('home')}
function page(p){if(p==='maintenance'&&!roleGate('maintenance'))return;if(p==='plan'&&!roleGate('leader'))return;if(p==='dashboard'&&!roleGate('dashboard'))return;if(p==='settings'&&!roleGate('settings'))return;const c=document.getElementById('content');if(p==='home')home(c);if(p==='production'||p==='production2')production(c,p==='production2'?2:1);if(p==='plan')plan(c);if(p==='reports')reports(c);if(p==='maintenance')maintenance(c);if(p==='obstacles')obstacles(c);if(p==='dashboard')dashboard(c);if(p==='settings')settings(c)}
function home(c){const vals=Object.values(store.records);const d=vals.filter(x=>x.date===today());const total=d.reduce((a,x)=>a+Number(x.actual||0),0);c.innerHTML=`<div class="panel"><h2 class="title">متابعة الإنتاج اللحظية</h2><p class="sub">البيانات موحدة بين الأجهزة من خلال Firebase. أي تسجيل يتم حفظه ويظهر على الأجهزة الأخرى.</p><div class="cards"><div class="card"><div class="small">إنتاج اليوم</div><div class="num">${total}</div></div><div class="card"><div class="small">ماكينات مسجلة اليوم</div><div class="num">${new Set(d.map(x=>x.machine)).size}</div></div><div class="card"><div class="small">الأعطال المفتوحة</div><div class="num">${store.faults.filter(x=>x.status!=='تم الإصلاح').length}</div></div><div class="card"><div class="small">المعوقات</div><div class="num">${store.obstacles.length}</div></div></div></div><div class="panel"><h2 class="title">حالة الماكينات اليوم</h2><div class="machine-grid">${store.machines.map(m=>{const r=d.find(x=>x.machine===m);return `<div class="machine ${r&&Number(r.actual)>=Number(r.target)?'done':''}"><div class="mname">${esc(m)}</div><div class="stat">${r?`المستهدف ${r.target} | الفعلي ${r.actual}`:'لم يسجل بعد'}</div></div>`}).join('')}</div></div>`}
function production(c,shift){const existing=Object.values(store.records).filter(x=>x.date===today()&&x.shift===shift);c.innerHTML=`<div class="panel"><h2 class="title">تسجيل الإنتاج - الوردية ${shift}</h2><div class="grid"><div class="field"><label>التاريخ</label><input id="pd" type="date" value="${today()}"></div><div class="field"><label>اختيار الماكينات المنتجة اليوم</label><select id="pm"><option value="">اختر الماكينة</option>${store.machines.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>المستهدف</label><input id="pt" type="number" min="0" value="${store.settings.targetPerHour*store.settings.workingHours}"></div><div class="field"><label>الإنتاج الفعلي</label><input id="pa" type="number" min="0"></div></div><div class="actions"><button class="btn" onclick="saveProduction(${shift})">حفظ الإنتاج</button></div></div><div class="panel"><h2 class="title">تسجيلات الوردية ${shift}</h2><div class="tablewrap"><table class="tbl"><tr><th>التاريخ</th><th>الماكينة</th><th>المستهدف</th><th>الفعلي</th><th>الكفاءة</th></tr>${existing.map(r=>`<tr><td>${r.date}</td><td>${esc(r.machine)}</td><td>${r.target}</td><td>${r.actual}</td><td>${r.target?Math.round(r.actual/r.target*100):0}%</td></tr>`).join('')}</table></div></div>`}
async function saveProduction(shift){const date=document.getElementById('pd').value,machine=document.getElementById('pm').value,target=Number(document.getElementById('pt').value),actual=Number(document.getElementById('pa').value);if(!date||!machine){toast('اختر التاريخ والماكينة');return}const key=date+'_'+shift+'_'+machine;store.records[key]={date,shift,machine,target,actual,updatedAt:Date.now()};await save();toast('تم حفظ الإنتاج');production(document.getElementById('content'),shift)}
function plan(c){const month=today().slice(0,7);c.innerHTML=`<div class="panel"><h2 class="title">الخطة الشهرية</h2><div class="notice">هذه الصفحة محمية لقائد فريق الإنتاج والإدارة العليا.</div><div class="grid" style="margin-top:10px"><div class="field"><label>الشهر</label><input id="planmonth" type="month" value="${month}"></div><div class="field"><label>اختيار الماكينة</label><select id="planmachine"><option value="">اختر الماكينة</option>${store.machines.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>المستهدف الشهري</label><input id="plantarget" type="number" min="0"></div></div><div class="actions"><button class="btn" onclick="savePlan()">حفظ الخطة</button></div></div><div class="panel"><h2 class="title">الخطة والفعلي والمتبقي</h2><div class="tablewrap"><table class="tbl"><tr><th>الماكينة</th><th>المستهدف</th><th>الفعلي</th><th>المتبقي</th><th>%</th></tr>${store.machines.map(m=>{const k=month+'_'+m,p=Number(store.plans[k]||0),a=Object.values(store.records).filter(r=>r.date.startsWith(month)&&r.machine===m).reduce((s,r)=>s+Number(r.actual||0),0);return p?`<tr><td>${esc(m)}</td><td>${p}</td><td>${a}</td><td>${Math.max(p-a,0)}</td><td>${p?Math.round(a/p*100):0}%</td></tr>`:''}).join('')}</table></div></div>`}
async function savePlan(){const m=document.getElementById('planmonth').value,machine=document.getElementById('planmachine').value,target=Number(document.getElementById('plantarget').value);if(!m||!machine){toast('اختر الشهر والماكينة');return}store.plans[m+'_'+machine]=target;await save();toast('تم الحفظ');plan(document.getElementById('content'))}
function reports(c){const rs=Object.values(store.records);c.innerHTML=`<div class="panel"><h2 class="title">تقارير الإنتاج</h2><div class="grid"><div class="field"><label>من</label><input id="rf" type="date" value="${today()}"></div><div class="field"><label>إلى</label><input id="rt" type="date" value="${today()}"></div><div class="field"><label>الوردية</label><select id="rs"><option value="">الكل</option><option value="1">الأولى</option><option value="2">الثانية</option></select></div></div><div class="actions"><button class="btn" onclick="renderReport()">عرض التقرير</button><button class="btn" onclick="window.print()">طباعة</button></div><div id="reportout" style="margin-top:12px"></div></div>`;renderReport()}
function renderReport(){const f=document.getElementById('rf').value,t=document.getElementById('rt').value,s=document.getElementById('rs').value;const rs=Object.values(store.records).filter(r=>(!f||r.date>=f)&&(!t||r.date<=t)&&(!s||String(r.shift)===s));const total=rs.reduce((a,r)=>a+Number(r.actual||0),0),target=rs.reduce((a,r)=>a+Number(r.target||0),0);document.getElementById('reportout').innerHTML=`<div class="cards"><div class="card">الإنتاج الفعلي<div class="num">${total}</div></div><div class="card">المستهدف<div class="num">${target}</div></div><div class="card">الكفاءة<div class="num">${target?Math.round(total/target*100):0}%</div></div></div><div class="tablewrap" style="margin-top:12px"><table class="tbl"><tr><th>التاريخ</th><th>الوردية</th><th>الماكينة</th><th>المستهدف</th><th>الفعلي</th><th>الكفاءة</th></tr>${rs.map(r=>`<tr><td>${r.date}</td><td>${r.shift}</td><td>${esc(r.machine)}</td><td>${r.target}</td><td>${r.actual}</td><td>${r.target?Math.round(r.actual/r.target*100):0}%</td></tr>`).join('')}</table></div>`}
function maintenance(c){c.innerHTML=`<div class="panel"><h2 class="title">تقرير الصيانة</h2><div class="grid"><div class="field"><label>الماكينة</label><select id="mm">${store.machines.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input id="md" type="date" value="${today()}"></div><div class="field"><label>الوردية</label><select id="ms"><option>1</option><option>2</option></select></div><div class="field"><label>نوع العطل</label><input id="mt" placeholder="نوع العطل"></div><div class="field"><label>التفاصيل</label><textarea id="mx"></textarea></div></div><div class="actions"><button class="btn" onclick="saveMaintenance()">حفظ</button><button class="btn" onclick="window.print()">طباعة</button></div></div><div class="panel"><h2 class="title">السجل</h2><table class="tbl"><tr><th>التاريخ</th><th>الماكينة</th><th>الوردية</th><th>العطل</th><th>التفاصيل</th></tr>${store.maintenance.map(x=>`<tr><td>${x.date}</td><td>${esc(x.machine)}</td><td>${x.shift}</td><td>${esc(x.type)}</td><td>${esc(x.details)}</td></tr>`).join('')}</table></div>`}
async function saveMaintenance(){store.maintenance.push({date:document.getElementById('md').value,machine:document.getElementById('mm').value,shift:document.getElementById('ms').value,type:document.getElementById('mt').value,details:document.getElementById('mx').value,createdAt:Date.now()});await save();toast('تم حفظ تقرير الصيانة');maintenance(document.getElementById('content'))}
function obstacles(c){c.innerHTML=`<div class="panel"><h2 class="title">معوقات الإنتاج</h2><div class="grid"><div class="field"><label>التاريخ</label><input id="od" type="date" value="${today()}"></div><div class="field"><label>الوقت</label><input id="otm" type="time"></div><div class="field"><label>الوردية</label><select id="os"><option>1</option><option>2</option></select></div><div class="field"><label>المكان</label><input id="opl" placeholder="المكان"></div><div class="field"><label>المعوق</label><textarea id="ot"></textarea></div></div><div class="actions"><button class="btn" onclick="saveObstacle()">حفظ المعوق</button><button class="btn" onclick="window.print()">طباعة</button></div></div><div class="panel"><h2 class="title">سجل المعوقات</h2><table class="tbl"><tr><th>التاريخ</th><th>الوقت</th><th>الوردية</th><th>المكان</th><th>المعوق</th></tr>${store.obstacles.map(x=>`<tr><td>${x.date}</td><td>${x.time}</td><td>${x.shift}</td><td>${esc(x.place)}</td><td>${esc(x.text)}</td></tr>`).join('')}</table></div>`}
async function saveObstacle(){store.obstacles.push({date:document.getElementById('od').value,time:document.getElementById('otm').value,shift:document.getElementById('os').value,place:document.getElementById('opl').value,text:document.getElementById('ot').value,createdAt:Date.now()});await save();toast('تم حفظ المعوق');obstacles(document.getElementById('content'))}
function dashboard(c){const todayRows=Object.values(store.records).filter(x=>x.date===today()),total=todayRows.reduce((a,x)=>a+Number(x.actual||0),0),target=todayRows.reduce((a,x)=>a+Number(x.target||0),0);c.innerHTML=`<div class="panel"><h2 class="title">لوحة الإدارة</h2><div class="cards"><div class="card">إنتاج اليوم<div class="num">${total}</div></div><div class="card">المستهدف<div class="num">${target}</div></div><div class="card">الكفاءة<div class="num">${target?Math.round(total/target*100):0}%</div></div><div class="card">أعطال مفتوحة<div class="num">${store.faults.filter(x=>x.status!=='تم الإصلاح').length}</div></div></div></div><div class="panel"><h2 class="title">الأعطال</h2><table class="tbl"><tr><th>التاريخ</th><th>الماكينة</th><th>العطل</th><th>الحالة</th><th>المدة</th></tr>${store.faults.map(x=>`<tr><td>${x.date}</td><td>${esc(x.machine)}</td><td>${esc(x.text)}</td><td>${esc(x.status||'مفتوح')}</td><td>${x.duration||''}</td></tr>`).join('')}</table></div>`}
function settings(c){c.innerHTML=`<div class="panel"><h2 class="title">الإعدادات</h2><div class="grid"><div class="field"><label>هدف الساعة</label><input id="sh" type="number" value="${store.settings.targetPerHour}"></div><div class="field"><label>عدد ساعات التشغيل</label><input id="sw" type="number" value="${store.settings.workingHours}"></div></div><div class="actions"><button class="btn" onclick="saveSettings()">حفظ المعادلات</button></div></div><div class="panel"><h2 class="title">إدارة الماكينات والقيم</h2><div class="field"><label>إضافة ماكينة أو نوع جديد</label><input id="newm" placeholder="اكتب الاسم ثم إضافة"></div><div class="actions"><button class="btn" onclick="addMachine()">إضافة</button></div><div class="tablewrap" style="margin-top:10px"><table class="tbl"><tr><th>الماكينة</th><th>إجراء</th></tr>${store.machines.map((m,i)=>`<tr><td>${esc(m)}</td><td><button class="btn red" onclick="removeMachine(${i})">حذف</button></td></tr>`).join('')}</table></div></div><div class="panel"><h2 class="title">الصلاحيات</h2><p class="sub">إدارة الصيانة: 130150 — قائد فريق إنتاج: 588855 — لوحة الإدارة: 205080 — إعدادات التقارير: 180120 — الإدارة العليا: 226622</p></div>`}
async function saveSettings(){store.settings.targetPerHour=Number(document.getElementById('sh').value)||1;store.settings.workingHours=Number(document.getElementById('sw').value)||8;await save();toast('تم حفظ المعادلات')}
async function addMachine(){const m=document.getElementById('newm').value.trim();if(!m)return;if(!store.machines.includes(m))store.machines.push(m);await save();toast('تمت إضافة الماكينة');settings(document.getElementById('content'))}
async function removeMachine(i){if(store.machines.length<=1)return;if(!confirm('حذف الماكينة من القائمة؟'))return;store.machines.splice(i,1);await save();settings(document.getElementById('content'))}
function start(){if(!Array.isArray(store.machines)||!store.machines.length)store.machines=defaultMachines; shell()}
ref.onSnapshot(s=>{if(s.exists&&s.data()&&s.data().data){store=Object.assign(store,s.data().data);store.machines=store.machines||defaultMachines;store.records=store.records||{};store.faults=store.faults||[];store.maintenance=store.maintenance||[];store.obstacles=store.obstacles||[];store.plans=store.plans||{};store.settings=Object.assign({targetPerHour:1,workingHours:8},store.settings||{});if(document.getElementById('content')){const active=document.querySelector('.btn.active');}}else{save()};start()},e=>{console.error(e);start()});
</script></body></html>
