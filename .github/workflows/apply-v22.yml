name: Apply ACROW Factory v22

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Apply ACROW Factory v22')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate v22
        run: |
          set -e
          if grep -q 'production-layout-v22.js' index.html; then
            echo 'v22 already active'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="./production-fix-v14.js"></script>'
          if marker not in s:
              raise SystemExit('stable v14 script marker not found')
          s=s.replace(marker, marker+'\n<script src="./production-layout-v22.js"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply ACROW Factory v22'
          git push
