name: Install monthly-plan daily-production sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh selector cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'\./daily-selector-hard-fix\.js\?v=\d+', './daily-selector-hard-fix.js?v=253', s)
          tag='<script src="./daily-selector-hard-fix.js?v=253"></script>'
          if tag not in s:
              marker='<script src="./settings-buttons-fix.js?v=1"></script>'
              if marker in s: s=s.replace(marker, marker+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit app wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No wiring changes"; else git commit -m "Use monthly plan machines in daily selector"; git push; fi
