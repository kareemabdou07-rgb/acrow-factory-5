name: v201 Live Production Loader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add v201 loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- v201-live-production-loader -->'
          tag=marker+'\n<script src="./v201-live-production.js"></script>\n'
          if marker not in s:
              pos=s.rfind('</body>')
              if pos<0: raise SystemExit('No closing body tag')
              s=s[:pos]+tag+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activate v201 live production sync"
          git pull --rebase origin main
          git push origin HEAD:main
