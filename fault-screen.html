<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة الأعطال — ACROW Factory 5</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#081a2f;--card:#102a45;--line:#285477;--text:#fff;--dim:#a9bac9;--red:#ef4444;--green:#16a34a;--blue:#0879d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Arial,sans-serif;padding:16px}header{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:24px}header p{margin:4px 0;color:var(--dim)}button{font-family:inherit;font-weight:800;border:1px solid var(--line);border-radius:9px;padding:10px 15px;cursor:pointer;background:var(--blue);color:#fff}.new{max-width:1100px;margin:16px auto;background:#7f1d1d;border:2px solid var(--red);border-radius:12px;padding:14px;text-align:center;font-size:19px;font-weight:900;display:none}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{background:var(--card);border:2px solid var(--red);border-radius:13px;padding:15px}.machine{font-size:19px;font-weight:900}.meta{color:var(--dim);font-size:13px;margin:4px 0 10px}.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.label{color:var(--dim)}.value{font-weight:800;text-align:left}.time{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.time input{background:#061323;color:#fff;border:1px solid var(--line);border-radius:7px;padding:8px}.save{background:var(--blue)}.repair{width:100%;margin-top:10px;background:var(--green);border-color:var(--green);font-size:17px}.empty{max-width:1100px;margin:40px auto;text-align:center;color:var(--dim);font-size:18px}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--green);padding:22px 34px;border-radius:14px;font-weight:900;font-size:24px;display:none;z-index:9999;box-shadow:0 12px 35px rgba(0,0,0,.45)}</style></head><body><header><div><h1>شاشة الأعطال</h1><p>متابعة الأعطال الجديدة والإصلاح لحظة بلحظة</p></div><button id="refresh">تحديث</button></header><div id="new" class="new">يوجد عطل جديد على الشاشة، برجاء إصلاح العطل.</div><main id="grid" class="grid"></main><div id="toast" class="toast">تم إصلاح العطل</div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const cfg={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);const db=firebase.firestore(),ref=db.collection('acrowFactory5').doc('store');let store={records:{}},known={},baseline=true,audioCtx=null,working=false;const grid=document.getElementById('grid'),banner=document.getElementById('new'),toast=document.getElementById('toast');function unlock(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function speak(t){unlock();try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.volume=1;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function openRows(){let a=[];Object.entries(store.records||{}).forEach(([k,r])=>{let p=k.split('_');if(p.length<3)return;let sh=p[p.length-2],id=p[p.length-1],date=p.slice(0,-2).join('_');(r.faults||[]).forEach((f,i)=>{if(!f.endTime)a.push({key:k+'_'+i,k,date,sh,id,f,r})})});return a}function find(key){return openRows().find(x=>x.key===key)}function render(){let rs=openRows();banner.style.display=rs.length?'block':'none';grid.innerHTML=rs.length?rs.map(x=>`<div class="card"><div class="machine">ماكينة ${esc(x.id)}</div><div class="meta">التاريخ: ${esc(x.date)} — الوردية: ${esc(x.sh==='1'?'الأولى':'الثانية')}</div><div class="row"><span class="label">نوع العطل</span><span class="value">${esc(x.f.reason||'غير محدد')}</span></div><div class="row"><span class="label">وقت البداية</span><span class="value">${esc(x.f.startTime||'—')}</span></div><div class="row"><span class="label">الوصف</span><span class="value">${esc(x.f.description||'بدون وصف')}</span></div><div class="time">تعديل البداية <input type="time" data-start="${esc(x.key)}" value="${esc(x.f.startTime||'')}"><button class="save" data-save="${esc(x.key)}">حفظ الوقت</button></div><button class="repair" data-repair="${esc(x.key)}">تم الإصلاح</button></div>`).join(''):'<div class="empty">لا توجد أعطال مفتوحة حاليًا</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{if(working)return;let x=find(b.dataset.save),i=document.querySelector(`[data-start="${CSS.escape(b.dataset.save)}"]`);if(!x||!i)return;working=true;b.disabled=true;let old=x.f.startTime;x.f.startTime=i.value||old;try{await ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){x.f.startTime=old;alert('تعذر حفظ الوقت، حاول مرة أخرى')}finally{working=false;b.disabled=false;render()}});document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=async()=>{if(working)return;unlock();let x=find(b.dataset.repair);if(!x)return;working=true;b.disabled=true;b.textContent='جارٍ التسجيل...';let end=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});x.f.endTime=end;x.f.repairedAt=end;x.f.mins=calc(x.f.startTime,end);render();toast.style.display='block';try{await ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});speak('تم إصلاح العطل');setTimeout(()=>toast.style.display='none',1800)}catch(e){x.f.endTime='';x.f.repairedAt='';x.f.mins=0;toast.style.display='none';alert('تعذر تسجيل الإصلاح، حاول مرة أخرى');render()}finally{working=false}})}function calc(a,b){if(!a||!b)return 0;let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number),d=(bh*60+bm)-(ah*60+am);return d<0?d+1440:d}function check(){let rs=openRows(),cur={};rs.forEach(x=>cur[x.key]=1);if(baseline){if(Object.keys(cur).length){speak('يوجد عطل جديد على الشاشة، برجاء إصلاح العطل')}Object.keys(cur).forEach(k=>known[k]=1);baseline=false}else{Object.keys(cur).forEach(k=>{if(!known[k]){known[k]=1;speak('يوجد عطل جديد على الشاشة، برجاء إصلاح العطل')}})}Object.keys(known).forEach(k=>{if(!cur[k])delete known[k]});render()}ref.onSnapshot(s=>{if(s.exists&&s.data()&&s.data().data){store=s.data().data;check()}else render()},e=>console.error(e));document.getElementById('refresh').onclick=()=>{unlock();check()};document.addEventListener('click',unlock,{once:true});</script></body></html>
