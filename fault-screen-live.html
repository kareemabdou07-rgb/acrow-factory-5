<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة الأعطال والصيانة — ACROW Factory 5</title><style>:root{--bg:#071827;--card:#102a45;--line:#285477;--text:#fff;--dim:#a9bac9;--red:#ef4444;--green:#16a34a;--blue:#0879d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif;padding:16px}header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:28px}p{margin:4px 0;color:var(--dim)}button{font-family:inherit;font-weight:800;border:1px solid var(--line);border-radius:9px;padding:10px 15px;cursor:pointer;background:var(--blue);color:#fff}.new{max-width:1200px;margin:16px auto;background:#7f1d1d;border:2px solid var(--red);border-radius:12px;padding:14px;text-align:center;font-size:20px;font-weight:900;display:none}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.card{background:var(--card);border:2px solid var(--red);border-radius:14px;padding:16px}.machine{font-size:22px;font-weight:900}.meta{color:var(--dim);font-size:14px;margin:6px 0 12px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.label{color:var(--dim)}.value{font-weight:800;text-align:left}.repair{width:100%;margin-top:12px;background:var(--green);border-color:var(--green);font-size:17px}.empty{max-width:1200px;margin:40px auto;text-align:center;color:var(--dim);font-size:18px}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--green);padding:22px 34px;border-radius:14px;font-weight:900;font-size:24px;display:none;z-index:9999}</style></head><body><header><div><h1>شاشة الأعطال والصيانة</h1><p>متابعة الأعطال لحظة بلحظة</p></div><button id="audio">تشغيل الصوت</button></header><div id="new" class="new">يوجد عطل جديد على الشاشة، برجاء إصلاح العطل</div><main id="grid" class="grid"></main><div id="toast" class="toast">تم إصلاح الماكينة شكرا</div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const cfg={apiKey:'AIzaSyCGUyuOU-qG-Z5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);const ref=firebase.firestore().collection('acrowFactory5').doc('store');const names={'1712':'منشار RSA','982':'مثقاب','263':'مثقاب','882':'مثقاب','1522':'ليدجر أو رنج','999':'ليدجر أو رنج','5004':'ليدجر أو رنج','5003':'ليدجر أو رنج','1521':'ليدجر أو رنج','998':'ليدجر أو رنج','997':'رينج فيرتكال','996':'رينج فيرتكال','5006':'رينج فيرتكال','5005':'كاب لوك فيرتكال','450':'كاب لوك فيرتكال','1524':'كاب لوك فيرتكال','1523':'كاب لوك فيرتكال','402':'لحام يدوي','455':'لحام يدوي','118':'لحام يدوي','116':'لحام يدوي','404':'لحام يدوي','1502':'منطقة الفرز','2':'مكبس فريم كونيكتور','8':'تلسكوب','9':'شور بريس','10':'أسبجوت','forming-frame':'فريم تشكيل','114':'فريم كوباية'};let store={records:{}},known={},baseline=true;const grid=document.getElementById('grid'),banner=document.getElementById('new'),toast=document.getElementById('toast');function unlock(){try{let a=new(window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume()}catch(e){}}function speak(t){unlock();try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.9;u.volume=1;speechSynthesis.speak(u)}catch(e){}}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function machineName(id){return names[String(id)]||('ماكينة '+String(id))}function openRows(){let a=[];Object.entries(store.records||{}).forEach(([k,r])=>{let p=k.split('_');if(p.length<3)return;let sh=p[p.length-2],id=p[p.length-1],date=p.slice(0,-2).join('_');(r.faults||[]).forEach((f,i)=>{if(!f.endTime)a.push({key:k+'_'+i,k,date,sh,id,f})})});return a}function render(){let rs=openRows();banner.style.display=rs.length?'block':'none';grid.innerHTML=rs.length?rs.map(x=>`<div class="card"><div class="machine">${esc(machineName(x.id))}</div><div class="meta">رقم الماكينة: ${esc(x.id)} — التاريخ: ${esc(x.date)} — الوردية: ${esc(x.sh==='1'?'الأولى':'الثانية')}</div><div class="row"><span class="label">نوع العطل</span><span class="value">${esc(x.f.reason||'غير محدد')}</span></div><div class="row"><span class="label">وقت البداية</span><span class="value">${esc(x.f.startTime||'—')}</span></div><div class="row"><span class="label">الوصف</span><span class="value">${esc(x.f.description||'بدون وصف')}</span></div><button class="repair" data-repair="${esc(x.key)}">تم الإصلاح</button></div>`).join(''):'<div class="empty">لا توجد أعطال مفتوحة حاليًا</div>';document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=async()=>{unlock();let x=openRows().find(z=>z.key===b.dataset.repair);if(!x)return;x.f.endTime=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});x.f.repairedAt=x.f.endTime;await ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast.style.display='block';speak('تم إصلاح الماكينة شكرا');setTimeout(()=>toast.style.display='none',2500)})}function check(){let rs=openRows(),cur={};rs.forEach(x=>cur[x.key]=1);if(!baseline){Object.keys(cur).forEach(k=>{if(!known[k]){known[k]=1;speak('يوجد عطل جديد على الشاشة، برجاء إصلاح العطل')}})}else{Object.keys(cur).forEach(k=>known[k]=1);baseline=false}Object.keys(known).forEach(k=>{if(!cur[k])delete known[k]});render()}ref.onSnapshot(s=>{if(s.exists&&s.data()&&s.data().data){store=s.data().data;check()}else render()},e=>console.error(e));document.getElementById('audio').onclick=()=>{unlock();speak('تم تشغيل صوت شاشة الأعطال')};render();</script></body></html>
