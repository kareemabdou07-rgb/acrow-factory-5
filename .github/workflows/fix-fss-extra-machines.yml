name: Fix Five S extra machines
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Five S machine list
        shell: python
        run: |
          from pathlib import Path
          p = Path('five-s-safety-evaluation.js')
          s = p.read_text(encoding='utf-8')
          old = "function machineList(){var a=[];try{if(typeof DEFAULT_MACHINE_LIST!=='undefined'&&Array.isArray(DEFAULT_MACHINE_LIST)){a=DEFAULT_MACHINE_LIST.map(function(x){return {id:String(x[0]),name:String(x[1]),dept:x[2]};});}}catch(e){}if(!a.length){try{if(typeof MACHINES!=='undefined'&&Array.isArray(MACHINES)&&MACHINES.length)a=MACHINES.slice();}catch(e){}}if(!a.length){a=Array.from(document.querySelectorAll('.machine-card')).map(function(c){return {id:String(c.dataset.machine||c.getAttribute('data-machine-id')||''),name:(c.querySelector('.mc-name')?.textContent||'').trim()};}).filter(function(m){return m.id;});}return a;}"
          new = "function machineList(){var a=[];try{if(typeof DEFAULT_MACHINE_LIST!=='undefined'&&Array.isArray(DEFAULT_MACHINE_LIST)){a=DEFAULT_MACHINE_LIST.map(function(x){return {id:String(x[0]),name:String(x[1]),dept:x[2]};});}}catch(e){}try{if(typeof MACHINES!=='undefined'&&Array.isArray(MACHINES)&&MACHINES.length){MACHINES.forEach(function(m){var id=String(m.id||m[0]||'').trim();var name=String(m.name||m[1]||'').trim();if(id&&!a.some(function(x){return String(x.id)===id;}))a.push({id:id,name:name,dept:m.dept||m[2]});});}}catch(e){}try{Array.from(document.querySelectorAll('.machine-card')).forEach(function(c){var id=String(c.dataset.machine||c.getAttribute('data-machine-id')||'').trim();var name=(c.querySelector('.mc-name')?.textContent||'').trim();if(id&&!a.some(function(x){return String(x.id)===id;}))a.push({id:id,name:name});});}catch(e){}return a;}"
          if old not in s:
              print('Target already patched or source changed; no action needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add five-s-safety-evaluation.js
          git diff --cached --quiet || git commit -m "Include extra daily machines in Five S"
          git push