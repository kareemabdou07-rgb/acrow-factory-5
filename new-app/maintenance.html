<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACROW Factory 5 — شاشة الأعطال</title><style>body{font-family:Arial,Tahoma;background:#07131f;color:#fff;margin:0}.wrap{max-width:1000px;margin:auto;padding:16px}.head{position:sticky;top:0;background:#0b1c2b;padding:14px;z-index:2}.card{background:#10283a;border:2px solid #29445b;border-radius:12px;padding:14px;margin:12px 0}.open{border-color:#ff3e4d}.ok{border-color:#20b56b}.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer}.green{background:#159447;color:#fff}.alert{padding:14px;border-radius:10px;background:#6f1016;font-weight:900;font-size:19px}</style><div class="wrap"><div class="head"><h2>شاشة الأعطال — قسم الصيانة</h2><div id="alert" class="alert">جاري التحميل...</div></div><div id="list"></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>(function(){var cfg={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);var ref=firebase.firestore().collection('acrowFactory5').doc('cleanV1');function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function say(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}function render(s){var d=s.exists?s.data():{},fs=d.faults||[],open=fs.filter(f=>!f.endTime);alert.textContent=open.length?'يوجد '+open.length+' عطل جديد، برجاء إصلاح الماكينة':'لا توجد أعطال مفتوحة';alert.style.background=open.length?'#6f1016':'#14552f';list.innerHTML=fs.map((f,i)=>'<div class="card '+(!f.endTime?'open':'ok')+'"><h3>ماكينة '+esc(f.machine)+'</h3><b>'+esc(f.reason)+'</b><p>'+esc(f.details)+'</p><div>'+esc(f.date)+' — '+esc(f.time)+' — وردية '+esc(f.shift)+'</div>'+(!f.endTime?'<button class="btn green" data-i="'+i+'">تم إصلاح الماكينة</button>':'<b>تم الإصلاح: '+esc(f.endDate)+' '+esc(f.endTime)+'</b>')+'</div>').join('')||'<div class="card">لا توجد أعطال مسجلة.</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=function(){var f=fs[Number(b.dataset.i)];if(f.endTime)return;var n=new Date();f.endTime=n.toLocaleTimeString('ar-EG');f.endDate=n.toISOString().slice(0,10);f.status='تم الإصلاح';ref.set({faults:fs,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){say('تم إصلاح الماكينة، شكرًا.')})})}ref.onSnapshot(function(s){render(s);var d=s.exists?s.data():{};if((d.faults||[]).some(f=>!f.endTime))say('يوجد عطل جديد، برجاء إصلاح الماكينة')})})();</script></div>
