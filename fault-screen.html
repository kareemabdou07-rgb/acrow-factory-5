<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة الأعطال — ACROW Factory 5</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#071a2d;color:#fff;font-family:Tajawal,Arial,sans-serif;padding:14px}.wrap{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h1{margin:0;font-size:27px}.sub{color:#b9c8d6;margin-top:3px}.btn{background:linear-gradient(135deg,#0f6fff,#20b8ff);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:800 16px Tajawal;cursor:pointer}.sound{background:#20c96b}.sound.on{background:#168d4c}.alert{padding:14px;border-radius:11px;background:#3a3018;border:1px solid #ffd34d;color:#ffd34d;margin-bottom:14px;font-weight:900;text-align:center;font-size:19px}.list{max-height:calc(100vh - 150px);overflow:auto}.card{background:#111d2b;border:2px solid #20c96b;border-radius:13px;padding:15px;margin-bottom:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.machine{font-size:21px;font-weight:900}.newtag{color:#ffd34d;font-weight:900}.main{font-size:22px;font-weight:900;margin-top:12px}.meta{color:#b9c8d6;margin-top:5px}.desc{font-size:17px;margin-top:10px;line-height:1.6}.photo{margin-top:12px;text-align:center}.photo img{max-width:100%;max-height:330px;border-radius:10px;border:2px solid #36536d;cursor:pointer;object-fit:contain;background:#061321}.no-photo{color:#7f91a2;border:1px dashed #36536d;border-radius:9px;padding:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.repair{background:#16a34a}.details{background:#0879d1}.empty{text-align:center;color:#a9bac9;padding:50px 10px;font-size:20px}.status{font-size:13px;color:#8fa5b8;margin-top:4px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.modal.show{display:flex}.modal img{max-width:95vw;max-height:90vh;border-radius:10px}.modal button{position:absolute;top:15px;left:15px}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#111;border:5px solid #20c96b;border-radius:18px;padding:24px 30px;font-size:24px;font-weight:900;display:none;z-index:10000;box-shadow:0 10px 40px #0008}.toast.show{display:block}@media(max-width:650px){.head h1{font-size:23px}.top{align-items:flex-start}.machine{font-size:19px}.main{font-size:20px}.list{max-height:none}}</style></head><body><div class="wrap"><div class="head"><div><h1>شاشة الأعطال</h1><div class="sub">نفس شاشة الأعطال الموجودة داخل البرنامج — بيانات مباشرة من المصنع</div><div class="status" id="status">جاري الاتصال...</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn sound" id="sound">تفعيل الصوت</button><button class="btn" id="refresh">تحديث</button></div></div><div class="alert" id="alert">جاري تحميل الأعطال...</div><main class="list" id="list"></main></div><div class="modal" id="modal"><button class="btn" id="close">إغلاق</button><img id="big" src="" alt="صورة العطل"></div><div class="toast" id="toast"></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const cfg={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);const db=firebase.firestore(),ref=db.collection('acrowFactory5').doc('store');let store={records:{}},known={},ready=false,working=false,audioCtx=null,soundOn=false;const list=document.getElementById('list'),alertBox=document.getElementById('alert'),status=document.getElementById('status'),soundBtn=document.getElementById('sound'),toast=document.getElementById('toast');function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}function unlock(){try{const C=window.AudioContext||window.webkitAudioContext;if(C){audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume()}}catch(e){}}function speak(t){if(!soundOn)return;unlock();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.95;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}catch(e){}}soundBtn.onclick=()=>{unlock();soundOn=true;soundBtn.textContent='الصوت مفعل';soundBtn.classList.add('on');try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('تم تفعيل صوت شاشة الأعطال');u.lang='ar-EG';u.rate=.95;speechSynthesis.speak(u)}catch(e){}};function rows(){let out=[];Object.keys(store.records||{}).forEach(k=>{const r=store.records[k]||{};(r.faults||[]).forEach((f,i)=>{if(!f||f.endTime)return;out.push({key:k,index:i,f:f,machine:r.machine||f.machine||k,date:f.date||k})})});out.sort((a,b)=>String(b.f.date||b.date).localeCompare(String(a.f.date||a.date))||String(b.f.time||'').localeCompare(String(a.f.time||'')));return out}function calc(a){if(!a)return 0;const m=a.match(/^(\d{1,2}):(\d{2})/);if(!m)return 0;let start=+m[1]*60+ +m[2],now=new Date(),cur=now.getHours()*60+now.getMinutes(),d=cur-start;if(d<0)d+=1440;return d}function render(){const rs=rows();alertBox.textContent=rs.length?'يوجد '+rs.length+' عطل مفتوح — رجاء الإصلاح':'لا توجد أعطال مفتوحة حاليًا';list.innerHTML=rs.length?rs.map((x,n)=>{const f=x.f,dur=calc(f.startTime);return '<div class="card"><div class="top"><div class="machine">ماكينة '+esc(x.machine)+'</div><div class="newtag">يوجد عطل جديد — رجاء الإصلاح</div></div><div class="main">'+esc(f.reason||'عطل')+'</div><div class="meta">'+esc(f.date||x.date||'')+' — '+esc(f.time||'')+' — الوردية '+esc(f.shift||'')+'</div><div class="desc">'+esc(f.description||f.notes||'')+'</div><div class="meta">وقت البداية: '+esc(f.startTime||'—')+' — مدة العطل: '+dur+' دقيقة</div><div class="photo">'+(f.photo?'<img data-photo="'+n+'" src="'+f.photo+'" alt="صورة العطل">':'<div class="no-photo">لا توجد صورة للعطل</div>')+'</div><div class="actions"><button class="btn details" data-details="'+n+'">تفاصيل العطل</button><button class="btn repair" data-repair="'+n+'">تم الإصلاح</button></div></div>'}).join(''):'<div class="empty">لا توجد أعطال مفتوحة حاليًا</div>';list.querySelectorAll('[data-photo]').forEach(im=>im.onclick=()=>{document.getElementById('big').src=im.src;document.getElementById('modal').classList.add('show')});list.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>{const x=rows()[+b.dataset.details];if(x)showDetails(x)});list.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>repair(rows()[+b.dataset.repair],b))}function showDetails(x){const f=x.f;toast.textContent='تفاصيل العطل: '+(f.reason||'عطل')+' — '+(f.description||f.notes||'لا توجد تفاصيل');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3500)}async function repair(x,b){if(!x||!x.f||x.f.endTime||working)return;unlock();working=true;b.disabled=true;b.textContent='جارٍ التسجيل...';const now=new Date(),end=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');const old={endTime:x.f.endTime,repairedAt:x.f.repairedAt,mins:x.f.mins};x.f.endTime=end;x.f.repairedAt=end;x.f.mins=duration(x.f.startTime,end);render();try{await ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast.textContent='تم إصلاح العطل، شكرًا';toast.classList.add('show');speak('تم إصلاح العطل، شكرًا');setTimeout(()=>toast.classList.remove('show'),2200)}catch(e){x.f.endTime=old.endTime;x.f.repairedAt=old.repairedAt;x.f.mins=old.mins;render();toast.textContent='تعذر تسجيل الإصلاح، حاول مرة أخرى';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000)}finally{working=false}}function duration(a,b){if(!a||!b)return 0;let p=a.split(':').map(Number),q=b.split(':').map(Number),d=q[0]*60+q[1]-p[0]*60-p[1];return d<0?d+1440:d}function check(){const rs=rows(),cur={};rs.forEach(x=>cur[x.key+'|'+x.index+'|'+(x.f.time||'')+'|'+(x.f.reason||'')]=1);if(ready){let added=false;Object.keys(cur).forEach(k=>{if(!known[k])added=true});if(added)speak('يوجد عطل جديد، رجاء الإصلاح')}known=cur;ready=true;render()}ref.onSnapshot(s=>{status.textContent='متصل — آخر تحديث '+new Date().toLocaleTimeString('ar-EG');if(s.exists&&s.data()&&s.data().data){store=s.data().data;check()}else{store={records:{}};render()}},e=>{status.textContent='تعذر الاتصال بالبيانات';console.error(e)});document.getElementById('refresh').onclick=()=>{unlock();render()};document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');setInterval(()=>{if(ready)render()},60000);</script></body></html>
