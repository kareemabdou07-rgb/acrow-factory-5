name: Fix Firebase script placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Firebase script at the real document end
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./firebase-realtime.js"></script>'
          s=s.replace(tag,'')
          pos=s.rfind('</body>')
          if pos < 0:
              raise SystemExit('real closing body tag not found')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Place Firebase realtime script correctly'
          git rm .github/workflows/fix-firebase-tag.yml
          git commit -m 'Remove one-time Firebase tag fix workflow'
          git push
