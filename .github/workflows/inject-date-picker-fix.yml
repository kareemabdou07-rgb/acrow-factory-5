name: Inject date picker fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject date picker fix once
        shell: bash
        run: |
          set -e
          if grep -q 'date-picker-fix.js' index.html; then
            echo 'already injected'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="./date-picker-fix.js?v=1"></script>'
          if marker not in s:
              s=s.replace('</head>', marker+'\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix date pickers in efficiency and faults'
          git push
