# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject final entry repair into the published HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="acrow-entry-repair-v171">'
          if marker not in s:
              js = r'''<script id="acrow-entry-repair-v171">
          (function(){
            function hide(){
              var s=document.getElementById('acrowSplash');
              if(!s)return;
              s.classList.add('hidden','v171-off');
              s.setAttribute('aria-hidden','true');
              s.style.setProperty('display','none','important');
              s.style.setProperty('visibility','hidden','important');
              s.style.setProperty('opacity','0','important');
              s.style.setProperty('pointer-events','none','important');
              s.style.setProperty('z-index','-1','important');
            }
            function enter(e){
              if(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();}
              window.__acrowEntered171=true;
              document.body.classList.remove('splash-open');
              document.body.classList.add('v171-app-open');
              document.body.style.setProperty('overflow','auto','important');
              hide();
              try{if(typeof render==='function')render();}catch(x){console.error(x);}
              try{if(typeof renderReport==='function')renderReport();}catch(x){}
              window.scrollTo(0,0);
              return false;
            }
            function bind(){
              var b=document.getElementById('enterSystemBtn')||document.getElementById('enterBtn')||document.getElementById('loginBtn')||document.getElementById('splashEnterBtn');
              if(!b)return;
              b.onclick=enter;
              b.disabled=false;
              b.removeAttribute('disabled');
              b.style.setProperty('pointer-events','auto','important');
              b.style.setProperty('touch-action','manipulation','important');
              if(b.dataset.v171!=='1'){
                b.dataset.v171='1';
                b.addEventListener('click',enter,true);
                b.addEventListener('touchend',enter,true);
              }
            }
            document.addEventListener('click',function(e){
              var b=e.target&&e.target.closest?e.target.closest('#enterSystemBtn,#enterBtn,#loginBtn,#splashEnterBtn,#acrowSplash button'):null;
              if(b)enter(e);
            },true);
            function guard(){
              bind();
              if(window.__acrowEntered171)hide();
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',guard);else guard();
            if(window.MutationObserver)new MutationObserver(guard).observe(document.documentElement,{childList:true,subtree:true});
            setInterval(guard,100);
          })();
          </script>'''
              s = s.replace('</head>', js + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Inject safe machine-list migration into the published HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="acrow-safe-machine-list-v1">'
          if marker not in s:
              js = r'''<script id="acrow-safe-machine-list-v1">
          (function(){
            function apply(){
              try{
                if(typeof store==='undefined' || !store || !store.settings) return false;
                if(typeof MACHINES==='undefined' || !Array.isArray(MACHINES) || !MACHINES.length) return false;
                if(store.settings.__acrowSafeMachineListV1) return true;
                var ids=MACHINES.map(function(m){return String(m.id);});
                var fav=Array.isArray(store.favorites)?new Set(store.favorites.map(String)):new Set();
                ids.forEach(function(id){fav.add(id);});
                store.favorites=Array.from(fav);
                var plan=new Set(Array.isArray(store.settings.planMachineIds)?store.settings.planMachineIds.map(String):[]);
                ids.forEach(function(id){plan.add(id);});
                store.settings.planMachineIds=Array.from(plan);
                store.settings.planStatusMachineIds=Array.from(plan);
                store.settings.__acrowSafeMachineListV1=true;
                if(typeof saveStore==='function')saveStore();
                try{if(typeof renderMachineSelectList==='function')renderMachineSelectList();}catch(e){}
                try{if(typeof renderPlanMachineSelectList==='function')renderPlanMachineSelectList();}catch(e){}
                try{if(typeof render==='function')render();}catch(e){}
                return true;
              }catch(e){return false;}
            }
            var tries=0;
            function boot(){
              if(apply() || ++tries>=30){clearInterval(timer);}
            }
            var timer=setInterval(boot,500);
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
          })();
          </script>'''
              s = s.replace('</head>', js + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Inject daily production machine selector repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="acrow-daily-production-machine-selector-v1">'
          if marker not in s:
              js = r'''<script id="acrow-daily-production-machine-selector-v1">
          (function(){
            function repair(){
              try{
                if(typeof store==='undefined' || !store || !store.settings) return false;
                if(typeof rebuildMachines==='function') rebuildMachines();
                if(typeof MACHINES==='undefined' || !Array.isArray(MACHINES) || !MACHINES.length) return false;
                if(!Array.isArray(store.favorites)) store.favorites=[];
                var seen=new Set(store.favorites.map(String));
                MACHINES.forEach(function(m){if(m && m.id!=null) seen.add(String(m.id));});
                store.favorites=Array.from(seen);
                if(typeof saveStore==='function') saveStore();
                if(typeof renderMachineSelectList==='function') renderMachineSelectList();
                var modal=document.getElementById('machineSelectModal');
                var list=document.getElementById('machineSelectList');
                if(!list) return false;
                if(!list.children.length){
                  list.innerHTML=MACHINES.map(function(m){
                    var id=String(m.id), name=String(m.name||id);
                    return '<label class="fav-checkbox-row"><input type="checkbox" data-machine-id="'+id.replace(/"/g,'&quot;')+'" checked> <span>'+id+' — '+name+'</span></label>';
                  }).join('');
                }
                return true;
              }catch(e){return false;}
            }
            var n=0;
            function boot(){if(repair() || ++n>=40) clearInterval(t);}
            var t=setInterval(boot,500);
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
          })();
          </script>'''
              s = s.replace('</head>', js + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
