name: Load immediate production sync
on:
  workflow_dispatch:
  push:
    paths:
      - 'live-production-sync.js'
      - '.github/workflows/add-live-production-sync.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add live sync script tag
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./live-production-sync.js?v=1"></script>'
          if 'live-production-sync.js' not in s:
              marker='<script src="./firebase-realtime.js"></script>'
              if marker not in s:
                  raise SystemExit('firebase-realtime script marker not found')
              s=s.replace(marker, marker+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add index.html
          git commit -m 'Load immediate production sync'
          git push
