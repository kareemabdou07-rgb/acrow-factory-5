name: Refresh production keyboard script cache
on:
  push:
    paths:
      - 'production-keyboard-lock-fix.js'
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[keyboard-cache-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump keyboard script cache version
        run: |
          sed -i 's#production-keyboard-lock-fix.js?v=[0-9]*#production-keyboard-lock-fix.js?v=2#' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump production keyboard script cache [keyboard-cache-bot]'
          git push
