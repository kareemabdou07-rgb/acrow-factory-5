name: Activate v204 all-machines sync
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  activate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace production sync loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- v203-production-input-loader -->\n<script src="./v203-production-input-fix.js"></script>'
          new='<!-- v204-all-machines-sync-loader -->\n<script src="./v204-all-machines-sync.js"></script>'
          if old not in s:
              old='<!-- v202-live-production-loader -->\n<script src="./v202-live-production-fix.js"></script>'
          if old not in s:
              raise SystemExit('expected production loader not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Activate v204 all-machines live sync"
          git push
