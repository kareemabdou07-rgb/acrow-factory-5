<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACROW Factory 5</title><style>body{margin:0;background:#0875c9;color:#fff;font-family:Arial;text-align:center;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{width:min(92%,420px);padding:35px 20px;border-radius:20px;background:#0867b0;box-shadow:0 8px 30px #034a7a}.logo{font-size:38px;font-weight:900;margin-bottom:18px}.time{font-size:28px;margin-bottom:6px}.date{font-size:20px;margin-bottom:25px}.btn{width:100%;padding:18px;border:0;border-radius:12px;background:#ffd400;color:#111;font-size:24px;font-weight:800;cursor:pointer}.btn:active{transform:scale(.98)}</style></head><body><div class="box"><div class="logo">ACROW Formwork Technology</div><div id="time" class="time">00:00:00</div><div id="date" class="date">--/--/----</div><button class="btn" onclick="openApp()">اضغط للدخول</button></div><script>function clock(){var d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});document.getElementById('date').textContent=d.toLocaleDateString('ar-EG');}clock();setInterval(clock,1000);function openApp(){location.href='./index.html?v=171';}</script></body></html>
