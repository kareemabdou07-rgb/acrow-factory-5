name: Activate production obstacles safely
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Activate production obstacles safely'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from stable index
        run: |
          git checkout dde218fbc11c1bd0ba5d4ec89adbbd4ae32b03d9 -- index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./production-obstacles-v27.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Stable index has no closing body tag')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Activate production obstacles safely'
          git push