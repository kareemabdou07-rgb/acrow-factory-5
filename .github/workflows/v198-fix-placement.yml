name: v198 Fix Script Placement
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<!-- v198-activate-shared-password-cloud-sync -->\n<script src="./v198-cloud-sync.js"></script>\n'
          s=s.replace(tag,'')
          marker='<!-- v198-main-loader -->'
          if marker not in s:
              pos=s.rfind('</body>')
              if pos<0:
                  s += '\n'+marker+'\n<script src="./v198-cloud-sync.js"></script>\n'
              else:
                  s=s[:pos]+marker+'\n<script src="./v198-cloud-sync.js"></script>\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix v198 loader placement"
          git pull --rebase origin main
          git push origin HEAD:main
