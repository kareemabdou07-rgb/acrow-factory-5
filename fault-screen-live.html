<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>شاشة الأعطال والصيانة — ACROW Factory 5</title><style>:root{--bg:#071827;--card:#102a45;--line:#285477;--text:#fff;--dim:#a9bac9;--red:#ef4444;--green:#16a34a;--blue:#0879d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif;padding:16px}header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:28px}p{margin:4px 0;color:var(--dim)}button{font-family:inherit;font-weight:800;border:1px solid var(--line);border-radius:9px;padding:10px 15px;cursor:pointer;background:var(--blue);color:#fff}.new{max-width:1200px;margin:16px auto;background:#7f1d1d;border:2px solid var(--red);border-radius:12px;padding:14px;text-align:center;font-size:20px;font-weight:900;display:none}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.card{background:var(--card);border:2px solid var(--red);border-radius:14px;padding:16px}.machine{font-size:22px;font-weight:900}.meta{color:var(--dim);font-size:14px;margin:6px 0 12px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.label{color:var(--dim)}.value{font-weight:800;text-align:left;white-space:pre-wrap}.fault-photo{max-width:100%;max-height:260px;border-radius:10px;margin-top:12px;border:1px solid var(--line)}.repair{width:100%;margin-top:12px;background:var(--green);border-color:var(--green);font-size:17px}.repair:disabled{opacity:.6;cursor:wait}.empty{max-width:1200px;margin:40px auto;text-align:center;color:var(--dim);font-size:18px}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--green);padding:22px 34px;border-radius:14px;font-weight:900;font-size:24px;display:none;z-index:9999}</style></head><body><header><div><h1>شاشة الأعطال والصيانة</h1><p id="status">جاري الاتصال...</p></div><button id="audio">تشغيل الصوت</button></header><div id="new" class="new">يوجد عطل جديد على الشاشة، برجاء إصلاح العطل</div><main id="grid" class="grid"></main><div id="toast" class="toast">تم إصلاح الماكينة شكرا</div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const cfg={apiKey:'AIzaSyCGUyuOU-qG-Z5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);const db=firebase.firestore(),ref=db.collection('acrowFactory5').doc('store');const names={'1712':'منشار RSA','982':'مثقاب','263':'مثقاب','882':'مثقاب','1522':'ليدجر أو رنج','999':'ليدجر أو رنج','5004':'ليدجر أو رنج','5003':'ليدجر أو رنج','1521':'ليدجر أو رنج','998':'ليدجر أو رنج','997':'رينج فيرتكال','996':'رينج فيرتكال','5006':'رينج فيرتكال','5005':'كاب لوك فيرتكال','450':'كاب لوك فيرتكال','1524':'كاب لوك فيرتكال','1523':'كاب لوك فيرتكال','402':'لحام يدوي','455':'لحام يدوي','118':'لحام يدوي','116':'لحام يدوي','404':'لحام يدوي','1502':'منطقة الفرز','2':'مكبس فريم كونيكتور','8':'تلسكوب','9':'شور بريس','10':'أسبجوت','forming-frame':'فريم تشكيل','114':'فريم كوباية'};let store={records:{}},previousActive=null,alertTimer=null;const grid=document.getElementById('grid'),banner=document.getElementById('new'),toast=document.getElementById('toast'),status=document.getElementById('status');function unlock(){try{const a=new(window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume()}catch(e){}}function speak(t){unlock();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=.9;u.volume=1;speechSynthesis.speak(u)}catch(e){}}function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function machineName(id){return names[String(id)]||('ماكينة '+String(id))}function partsForKey(k){const p=String(k).split('_');if(p.length<3)return {date:'',sh:'',id:''};return {date:p.slice(0,-2).join('_'),sh:p[p.length-2],id:p[p.length-1]}}function getId(k,r,f){return String((f&&((f.machineId??f.machine??f.machineNumber??f.machineNo)))??(r&&((r.machineId??r.machine??r.machineNumber??r.machineNo)))??partsForKey(k).id)}function faultSignature(x){const f=x.f||{};return [x.date,x.sh,x.id,f.startTime||f.startedAt||'',f.reason||f.faultType||f.type||'',f.category||f.faultCategory||'',f.description||f.details||f.note||''].map(v=>String(v)).join('|')}function openRows(){const a=[];Object.entries(store.records||{}).forEach(([k,r])=>{if(!r||!Array.isArray(r.faults))return;const parts=partsForKey(k);r.faults.forEach((f,i)=>{if(f&&!f.endTime)a.push({key:k+'_'+i,k,index:i,date:parts.date,sh:parts.sh,id:getId(k,r,f),f})})});return a}function faultRows(x){const f=x.f||{};const fields=[['نوع العطل',f.reason||f.faultType||f.type],['التصنيف',f.category||f.faultCategory],['وقت البداية',f.startTime||f.startedAt],['الوصف',f.description||f.details||f.note],['المشغل',f.operator||f.user||f.worker],['ملاحظات',f.notes]];return fields.filter(v=>v[1]!==undefined&&v[1]!==null&&String(v[1])!=='').map(v=>`<div class="row"><span class="label">${esc(v[0])}</span><span class="value">${esc(v[1])}</span></div>`).join('')}function render(){const rs=openRows();banner.style.display=rs.length?'block':'none';grid.innerHTML=rs.length?rs.map(x=>{const photo=x.f&&x.f.photo?`<img class="fault-photo" src="${esc(x.f.photo)}" alt="صورة العطل">`:'';return `<div class="card"><div class="machine">${esc(machineName(x.id))}</div><div class="meta">رقم الماكينة: ${esc(x.id)} — التاريخ: ${esc(x.date)} — الوردية: ${esc(x.sh==='1'?'الأولى':x.sh==='2'?'الثانية':x.sh||'—')}</div>${faultRows(x)}${photo}<button class="repair" data-repair="${esc(x.key)}">تم الإصلاح</button></div>`}).join(''):'<div class="empty">لا توجد أعطال مفتوحة حاليًا</div>';document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>repair(b.dataset.repair,b))}async function repair(compositeKey,button){unlock();const bits=String(compositeKey).split('_');const index=Number(bits.pop());const k=bits.join('_');button.disabled=true;try{await db.runTransaction(async tx=>{const snap=await tx.get(ref);const data=snap.exists&&snap.data()&&snap.data().data?snap.data().data:{};const records=data.records||{};const rec=records[k];if(!rec||!Array.isArray(rec.faults)||!rec.faults[index]||rec.faults[index].endTime)throw new Error('العطل غير موجود أو تم إصلاحه بالفعل');const now=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});rec.faults[index].endTime=now;rec.faults[index].repairedAt=now;tx.set(ref,{data:data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});toast.textContent='تم إصلاح الماكينة شكرا';toast.style.display='block';speak('تم إصلاح الماكينة شكرا');setTimeout(()=>toast.style.display='none',2500)}catch(e){console.error(e);toast.textContent='تعذر تسجيل الإصلاح';toast.style.display='block';setTimeout(()=>toast.style.display='none',2500)}finally{button.disabled=false}}function detect(active){const cur={};active.forEach(x=>cur[faultSignature(x)]=1);if(previousActive!==null){const added=Object.keys(cur).filter(k=>!previousActive[k]);if(added.length){banner.style.display='block';speak('يوجد عطل جديد على الشاشة، برجاء إصلاح العطل');clearTimeout(alertTimer);alertTimer=setTimeout(()=>{if(openRows().length)banner.style.display='block'},500)}}previousActive=cur;render()}ref.onSnapshot(s=>{status.textContent='متصل — متابعة لحظية';if(s.exists&&s.data()&&s.data().data){store=s.data().data;detect(openRows())}else{store={records:{}};previousActive={};render()}},e=>{status.textContent='خطأ في الاتصال';console.error(e)});document.getElementById('audio').onclick=()=>{unlock();speak('تم تشغيل صوت شاشة الأعطال')};render();</script></body></html>
