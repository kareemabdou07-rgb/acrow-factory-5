<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACROW — إدارة الأعطال</title><style>body{margin:0;background:#0b1520;color:#fff;font-family:Tajawal,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.head{position:sticky;top:0;background:#0b1520;padding:10px 0;z-index:5}.title{font-size:24px;font-weight:900}.sub{color:#9aa8b5;margin-top:4px}.alert{margin:14px 0;padding:14px;border-radius:12px;background:#8e0000;border:2px solid #fff;font-size:19px;font-weight:900;text-align:center}.ok{background:#14552f}.card{background:#111d2b;border:2px solid #ff5f6d;border-radius:14px;padding:16px;margin:12px 0}.card.done{border-color:#25e58f}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.machine{font-size:19px;font-weight:900}.status{font-weight:900;color:#ff5f6d}.done .status{color:#25e58f}.reason{font-size:20px;font-weight:900;margin-top:9px}.meta,.desc{color:#aab5c0;margin-top:7px}.media{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}.media img{max-width:240px;max-height:180px;border-radius:10px}.media audio{max-width:320px}.repair{margin-top:14px;background:#18a957;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-size:16px;font-weight:900;cursor:pointer}.empty{padding:30px;text-align:center;background:#111d2b;border-radius:12px}.link{margin-top:18px;color:#9aa8b5;font-size:12px;word-break:break-all}</style></head><body><div class="wrap"><div class="head"><div class="title">شاشة أعطال ACROW — إدارة الصيانة</div><div class="sub">هذه الشاشة مخصصة للأعطال فقط. اضغط «تم الإصلاح» بعد إصلاح العطل.</div></div><div id="alert" class="alert" style="display:none"></div><div id="list">جاري تحميل الأعطال...</div><div class="link">الرابط: <span id="url"></span></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>(function(){'use strict';var cfg={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};var ref;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function getFaults(data){var out=[];Object.keys((data&&data.records)||{}).forEach(function(k){var r=data.records[k]||{};(r.faults||[]).forEach(function(f,i){out.push({key:k,index:i,machine:r.machine||k,f:f,date:f.date||k});});});out.sort(function(a,b){return String(b.f.date||b.date).localeCompare(String(a.f.date||a.date))||String(b.f.time||'').localeCompare(String(a.f.time||''));});return out;}function render(data){var rows=getFaults(data),open=rows.filter(function(x){return !x.f.endTime;});var a=document.getElementById('alert');a.style.display='block';a.className='alert '+(!open.length?'ok':'');a.textContent=open.length?'يوجد '+open.length+' عطل مفتوح — برجاء الإصلاح':'تم الإصلاح — لا توجد أعطال مفتوحة';document.getElementById('list').innerHTML=rows.length?rows.map(function(x,n){var f=x.f,o=!f.endTime;return '<div class="card '+(o?'':'done')+'"><div class="row"><div class="machine">ماكينة '+esc(x.machine)+'</div><div class="status">'+(o?'يوجد عطل جديد — برجاء الإصلاح':'تم الإصلاح')+'</div></div><div class="reason">'+esc(f.reason||'عطل')+'</div><div class="meta">'+esc(f.date||x.date)+' — '+esc(f.time||'')+' — الوردية '+esc(f.shift||'')+(f.mins?' — '+esc(f.mins)+' دقيقة':'')+'</div><div class="desc">'+esc(f.description||f.notes||'')+'</div>'+(f.photo?'<div class="media"><img src="'+f.photo+'" alt="صورة العطل"></div>':'')+(f.audio?'<div class="media"><audio controls src="'+f.audio+'"></audio></div>':'')+(o?'<button class="repair" data-key="'+esc(x.key)+'" data-index="'+x.index+'">تم الإصلاح</button>':'')+'</div>';}).join(''):'<div class="empty">لا توجد أعطال مسجلة حتى الآن</div>';document.querySelectorAll('.repair').forEach(function(b){b.onclick=function(){repair(b.dataset.key,Number(b.dataset.index));};});}function repair(key,index){if(!ref)return;ref.get().then(function(snap){var wrapper=snap.exists?snap.data():{};var data=wrapper.data||{};var r=data.records&&data.records[key];if(!r||!r.faults||!r.faults[index])return;var f=r.faults[index];if(f.endTime)return;var d=new Date();f.endTime=d.toLocaleTimeString('en-GB');f.endDate=d.toISOString().slice(0,10);f.status='تم الإصلاح';return ref.set({data:data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}).then(function(){ }).catch(function(e){alert('تعذر حفظ الإصلاح: '+e.message);});}document.getElementById('url').textContent=location.href;firebase.initializeApp(cfg);ref=firebase.firestore().collection('acrowFactory5').doc('store');ref.onSnapshot(function(s){render(s.exists?s.data().data||{}:{});},function(e){document.getElementById('list').textContent='تعذر الاتصال بالبيانات المشتركة: '+e.message;});})();</script></body></html>
