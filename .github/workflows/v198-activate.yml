name: v198 Activate Shared Password And Cloud Sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate v198
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='v198-activate-shared-password-cloud-sync'
          if marker in s:
              print('v198 already active')
              raise SystemExit
          tag='<!-- '+marker+' -->\n<script src="./v198-cloud-sync.js"></script>\n'
          if '</body>' in s:
              s=s.replace('</body>',tag+'</body>',1)
          else:
              s += '\n'+tag
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate v198 shared password and realtime cloud sync"
          git pull --rebase origin main
          git push origin HEAD:main
