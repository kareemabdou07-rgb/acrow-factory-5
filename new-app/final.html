<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACROW Factory 5 NEW</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3f7;color:#102030}.app{max-width:1100px;margin:auto}.head{background:#0b4f8a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #0003}.brand{font-size:27px;font-weight:900}.clock{font-size:13px;margin-top:5px;opacity:.9}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.nav button,.action{border:0;border-radius:10px;padding:12px 15px;background:#147bd1;color:#fff;font-weight:900;font-size:14px}.nav button.on,.nav button:active,.action.yellow{background:#ffd21f;color:#111}.danger{background:#c91e2b!important}.green{background:#168b4b!important}.main{padding:14px}.screen{display:none}.screen.on{display:block}.hero{background:linear-gradient(135deg,#0b4f8a,#147bd1);color:white;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 5px 18px #174c7030}.hero h2{margin:0 0 8px;font-size:25px}.panel{background:#fff;border-radius:15px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #10203018;border:1px solid #dce5ec}.panel h3{margin:0 0 14px;color:#0b4f8a}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field label{font-weight:800;font-size:13px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd8e2;border-radius:9px;margin-top:5px;background:#f9fbfd}.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.machine{background:#f3f8fc;border:2px solid #cbdfea;border-radius:12px;padding:13px;font-weight:900}.machine.selected{border-color:#147bd1;background:#e5f2ff}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:16px;border-radius:12px;background:#0b4f8a;color:#fff}.stat b{display:block;font-size:27px;margin-top:5px}.notice{padding:12px;border-radius:10px;background:#fff7d6;border-right:5px solid #ffd21f}.empty{padding:20px;text-align:center;color:#718394}.progress{height:16px;background:#e4ebf0;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#147bd1}.report{display:grid;gap:8px}.bar{height:25px;background:#147bd1;border-radius:6px;color:#fff;text-align:center;font-weight:900;padding:3px}.fault{border-right:5px solid #c91e2b;background:#fff2f3}.block{border-right:5px solid #d99c00;background:#fff8df}@media(max-width:600px){.brand{font-size:22px}.nav button{flex:1;min-width:120px}.main{padding:9px}}
</style><body><div class="app"><header class="head"><div class="brand">ACROW Factory 5</div><div class="clock" id="clock"></div><nav class="nav"><button class="on" data-s="home">الرئيسية</button><button data-s="production">تسجيل الإنتاج</button><button data-s="plan">الخطة الشهرية</button><button data-s="reports">التقارير</button><button data-s="faults" class="danger">شاشة الأعطال</button><button data-s="machines">إدارة الماكينات</button></nav></header><main class="main">
<section id="home" class="screen on"><div class="hero"><h2>مصنع 5</h2><div>متابعة الإنتاج والخطة والأعطال في شاشة واحدة</div></div><div class="stats"><div class="stat">إنتاج اليوم<b id="sQty">0</b></div><div class="stat">ماكينات الخطة<b id="sMachines">0</b></div><div class="stat">أعطال مفتوحة<b id="sFaults">0</b></div></div><div class="panel"><h3>ماكينات الإنتاج اليوم</h3><div id="homeMachines" class="machines"></div></div></section>
<section id="production" class="screen"><div class="panel"><h3>تسجيل الإنتاج</h3><div class="form"><div class="field"><label>التاريخ<input id="date" type="date"></label></div><div class="field"><label>الوردية<select id="shift"><option>الأولى</option><option>الثانية</option></select></label></div><div class="field"><label>الماكينة<select id="machine"></select></label></div><div class="field"><label>المنتج<select id="product"><option>Cup Lock / Ledger / Ring Lock</option><option>Ring Lock Vertical</option><option>منطقة الفرز</option><option>شور بريس</option><option>التلسكوب</option><option>الفريم كوب</option><option>الفريم تشكيل</option><option>الفريم كونكتور</option></select></label></div><div class="field"><label>الكمية<input id="qty" type="number" min="1"></label></div></div><br><button class="action green" id="save">تسجيل الإنتاج</button><span id="msg"></span></div><div class="panel"><h3>الماكينات المتاحة</h3><div id="prodMachines" class="machines"></div></div></section>
<section id="plan" class="screen"><div class="panel"><h3>الخطة الشهرية</h3><div class="notice">الخطة الشهرية فقط تحتاج كلمة السر.</div><div class="form"><div class="field"><label>كلمة السر<input id="pass" type="password"></label></div><div class="field"><label>من<input id="from" type="date"></label></div><div class="field"><label>إلى<input id="to" type="date"></label></div></div><br><button class="action yellow" id="unlock">فتح الخطة</button><div id="planArea" style="display:none"><hr><h3>اختيار الماكينات</h3><div id="planMachines" class="machines"></div><div id="targets"></div><br><button class="action green" id="savePlan">حفظ الخطة</button></div></div></section>
<section id="reports" class="screen"><div class="panel"><h3>التقارير</h3><div class="form"><div class="field"><label>من<input id="rf" type="date"></label></div><div class="field"><label>إلى<input id="rt" type="date"></label></div></div><br><button class="action" id="report">عرض التقرير</button><button class="action" onclick="print()">طباعة التقارير</button><div id="reportOut"></div></div></section>
<section id="faults" class="screen"><div class="panel"><h3>شاشة الأعطال</h3><div id="faultOut"></div><br><button class="action danger" id="addFault">دخول عطل</button></div></section>
<section id="machines" class="screen"><div class="panel"><h3>إدارة الماكينات</h3><div class="form"><div class="field"><label>رقم الماكينة<input id="newId"></label></div><div class="field"><label>اسم الماكينة<input id="newName"></label></div></div><br><button class="action green" id="addMachine">إضافة ماكينة</button><div id="allMachines" class="machines" style="margin-top:12px"></div></div></section>
</main></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);const db=firebase.firestore(),ref=db.collection('acrowFactory5').doc('cleanV1');let st={machines:[],plan:{from:'',to:'',ids:[],targets:{}},productions:[],faults:[]};const seed=[['1712','منشار RSA'],['982','متقاب/مثقاب'],['263','مثقاب'],['882','مثقاب'],['1522','Ledger/Ring'],['999','Ledger/Ring'],['5004','Ledger/Ring'],['5003','Ledger/Ring'],['1521','Ledger/Ring'],['998','Ledger/Ring'],['997','Ring Vertical'],['996','Ring Vertical'],['5006','Ring Vertical'],['5005','Cup Lock Vertical'],['450','Cup Lock Vertical'],['1524','Cup Lock Vertical'],['1523','Cup Lock Vertical'],['402','لحام يدوي'],['455','لحام يدوي'],['118','لحام يدوي'],['116','لحام يدوي'],['404','لحام يدوي'],['1502','منطقة الفرز']];const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);function planned(){return st.plan.ids.map(id=>st.machines.find(m=>m.id===id)).filter(Boolean)}function saveData(){return ref.set(st,{merge:true})}function render(){let p=planned();$('machine').innerHTML=p.map(m=>`<option value="${m.id}">${m.id} — ${m.name}</option>`).join('');$('prodMachines').innerHTML=p.map(m=>`<div class="machine">${m.id}<br>${m.name}</div>`).join('')||'<div class="empty">لا توجد ماكينات مختارة في الخطة</div>';$('homeMachines').innerHTML=$('prodMachines').innerHTML;$('sMachines').textContent=p.length;$('allMachines').innerHTML=st.machines.map(m=>`<div class="machine">${m.id}<br>${m.name}</div>`).join('');$('planMachines').innerHTML=st.machines.map(m=>`<label class="machine"><input type="checkbox" data-plan="${m.id}" ${st.plan.ids.includes(m.id)?'checked':''}> ${m.id} — ${m.name}</label>`).join('');let d=today(),q=st.productions.filter(x=>x.date===d).reduce((s,x)=>s+Number(x.qty||0),0);$('sQty').textContent=q;$('sFaults').textContent=st.faults.filter(f=>!f.endTime).length;$('faultOut').innerHTML=st.faults.filter(f=>!f.endTime).map((f,i)=>`<div class="panel fault"><b>ماكينة ${f.machine}</b><br>${f.reason}<br>${f.date} ${f.time}<br><button class="action green" onclick="repair(${i})">تم إصلاح الماكينة</button></div>`).join('')||'<div class="empty">لا توجد أعطال مفتوحة</div>'}window.repair=i=>{let a=st.faults.filter(f=>!f.endTime),f=a[i];if(f){f.endTime=new Date().toLocaleTimeString('ar-EG');saveData();speechSynthesis.speak(new SpeechSynthesisUtterance('تم إصلاح الماكينة، شكرًا.'))}};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$((b.dataset.s)).classList.add('on');document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});$('date').value=today();$('rf').value=$('rt').value=today();$('from').value=$('to').value=today();$('save').onclick=()=>{if(!$('machine').value||!$('qty').value)return alert('اختار الماكينة والكمية');st.productions.push({date:$('date').value,shift:$('shift').value,machine:$('machine').value,product:$('product').value,qty:Number($('qty').value)});saveData().then(()=>{$('qty').value='';$('msg').textContent=' تم تسجيل الإنتاج';})};$('unlock').onclick=()=>{if($('pass').value!=='2026')return alert('كلمة السر غير صحيحة');$('planArea').style.display='block'};document.addEventListener('change',e=>{if(e.target.dataset.plan){st.plan.ids=[...document.querySelectorAll('[data-plan]:checked')].map(x=>x.dataset.plan);render()}});$('savePlan').onclick=()=>{st.plan.from=$('from').value;st.plan.to=$('to').value;saveData().then(render)};$('addMachine').onclick=()=>{let id=$('newId').value.trim(),name=$('newName').value.trim();if(!id||!name)return;if(st.machines.some(m=>m.id===id))return alert('الماكينة موجودة');st.machines.push({id,name});saveData().then(()=>{$('newId').value='';$('newName').value='';render()})};$('addFault').onclick=()=>{if(!$('machine').value)return alert('اختار ماكينة');let reason=prompt('نوع العطل؟');if(!reason)return;let d=new Date();st.faults.push({machine:$('machine').value,reason,date:today(),time:d.toLocaleTimeString('ar-EG')});saveData().then(()=>{render();speechSynthesis.speak(new SpeechSynthesisUtterance('يوجد عطل جديد، برجاء إصلاح الماكينة.'))})};$('report').onclick=()=>{let f=$('rf').value,t=$('rt').value,a=st.productions.filter(x=>(!f||x.date>=f)&&(!t||x.date<=t)),g={};a.forEach(x=>g[x.product]=(g[x.product]||0)+Number(x.qty));let rows=Object.entries(g).sort((a,b)=>b[1]-a[1]),mx=rows[0]?.[1]||1;$('reportOut').innerHTML=`<div class="panel"><b>الفترة:</b> ${f} إلى ${t}<br><b>الإجمالي:</b> ${a.reduce((s,x)=>s+x.qty,0)}</div><div class="report">${rows.map(x=>`<div><b>${x[0]}</b> — ${x[1]}<div class="bar" style="width:${x[1]/mx*100}%">${x[1]}</div></div>`).join('')}</div>`};ref.onSnapshot(s=>{if(s.exists)st=Object.assign(st,s.data());else{st.machines=seed.map(x=>({id:x[0],name:x[1]}));saveData()}render()});setInterval(()=>$('clock').textContent=new Date().toLocaleString('ar-EG',{dateStyle:'full',timeStyle:'short'}),1000);</script></body></html>
