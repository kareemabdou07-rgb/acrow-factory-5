name: Activate Firebase realtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add realtime script to current app only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./firebase-realtime.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no closing body tag')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            git rm .github/workflows/activate-firebase-realtime.yml
            git commit -m 'Finish Firebase realtime activation workflow'
          else
            git add index.html
            git commit -m 'Activate Firebase realtime sync'
            git rm .github/workflows/activate-firebase-realtime.yml
            git commit -m 'Remove one-time Firebase activation workflow'
          fi
          git push
