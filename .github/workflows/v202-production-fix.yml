name: v202 Production Save Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch production loader to v202
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- v201-live-production-loader -->\n<script src="./v201-live-production.js"></script>\n'
          new='<!-- v202-live-production-loader -->\n<script src="./v202-live-production-fix.js"></script>\n'
          s=s.replace(old,'')
          if new not in s:
              pos=s.rfind('</body>')
              if pos<0: s += '\n'+new
              else: s=s[:pos]+new+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activate v202 production save fix"
          git pull --rebase origin main
          git push origin HEAD:main
