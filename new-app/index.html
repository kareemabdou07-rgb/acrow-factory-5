<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACROW Factory 5 — Clean V1</title><style>body{margin:0;background:#07131f;color:#eef4f8;font-family:Arial,Tahoma,sans-serif}*{box-sizing:border-box}.wrap{max-width:1200px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:20;background:#0b1c2b;border-bottom:1px solid #29445b;padding:12px;border-radius:0 0 12px 12px}.top h1{margin:0;font-size:22px}.sub{color:#9fb0bf;font-size:12px;margin-top:4px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:#147bd1;color:white}.btn.active{background:#ffd447;color:#111}.btn.red{background:#c91520}.btn.green{background:#159447}.btn.gray{background:#425466}.panel{background:#0e2232;border:1px solid #29445b;border-radius:13px;padding:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{background:#10283a;border:1px solid #29445b;border-radius:11px;padding:12px}.card h3{margin:0 0 8px}.input,select,textarea{width:100%;background:#071722;color:#fff;border:1px solid #36556d;border-radius:8px;padding:9px;margin:4px 0 8px}textarea{min-height:80px}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.hide{display:none}.machine{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{padding:4px 8px;border-radius:20px;background:#174c70;font-size:11px}.fault{border:2px solid #d31d29}.blocker{border:2px solid #d99c00}.range{display:flex;gap:8px;flex-wrap:wrap}.range label{flex:1;min-width:150px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #29445b;padding:8px;text-align:right;font-size:13px}.openfault{background:#6f1016;border:2px solid #ff5963}.chart{height:240px;background:#071722;border:1px solid #29445b;border-radius:10px;padding:10px}.bar{height:20px;background:#147bd1;border-radius:5px;margin:8px 0}.bar span{display:block;text-align:center;font-size:11px;font-weight:bold}.print{background:#f0f3f5;color:#111}@media print{.no-print,.nav,.top{display:none!important}body{background:white;color:#111}.panel,.card,.chart{border:1px solid #999;background:white;color:#111}}</style></head><body><div class="wrap"><header class="top"><h1>ACROW Factory 5 — النظام الجديد</h1><div class="sub">نسخة نظيفة — البيانات المشتركة مباشرة عبر Firebase</div><div class="nav no-print"><button class="btn active" data-go="home">الرئيسية</button><button class="btn" data-go="machines">إدارة الماكينات</button><button class="btn" data-go="plan">الخطة</button><button class="btn" data-go="reports">التقارير</button><button class="btn red" data-go="faults">شاشة الأعطال</button><button class="btn" data-go="maintenance">الصيانة</button></div></header><main id="home"><section class="panel"><h2>تسجيل الإنتاج</h2><div class="row"><label>التاريخ<input id="pdate" class="input" type="date"></label><label>الوردية<select id="pshift"><option>الأولى</option><option>الثانية</option></select></label><label>الماكينة<select id="pmachine"></select></label><label>المنتج<input id="pproduct" class="input" placeholder="اسم المنتج"></label><label>الكمية<input id="pqty" class="input" type="number" min="0"></label></div><div class="nav no-print"><button class="btn green" id="saveProd">تسجيل الإنتاج</button><button class="btn red" id="newFault">دخول عطل</button><button class="btn" id="newBlock">معوق إنتاج</button></div></section><section class="panel"><h2>الماكينات المنتجة اليوم</h2><div id="dailyMachines" class="grid"></div></section></main><section id="machines" class="hide"><div class="panel"><h2>إدارة الماكينات</h2><div class="row"><input id="mid" class="input" placeholder="رقم الماكينة"><input id="mname" class="input" placeholder="اسم/نوع الماكينة"><input id="mgroup" class="input" placeholder="المجموعة"></div><div class="nav no-print"><button class="btn green" id="addMachine">إضافة ماكينة</button></div><div id="machineList" class="grid"></div></div></section><section id="plan" class="hide"><div class="panel"><h2>الخطة الشهرية</h2><div class="row"><input id="planPass" class="input" type="password" placeholder="كلمة سر الخطة"><button class="btn" id="unlockPlan">دخول</button></div><div id="planBody" class="hide"><div class="range"><label>من<input id="planFrom" class="input" type="date"></label><label>إلى<input id="planTo" class="input" type="date"></label></div><div id="planMachines" class="grid"></div><button class="btn green no-print" id="savePlan">حفظ الخطة</button></div></div></section><section id="reports" class="hide"><div class="panel"><h2>التقارير وتجميع المنتجات</h2><div class="range"><label>من<input id="rfrom" class="input" type="date"></label><label>إلى<input id="rto" class="input" type="date"></label><label>الوردية<select id="rshift"><option value="all">الكل</option><option>الأولى</option><option>الثانية</option></select></label></div><div class="nav no-print"><button class="btn active" id="runReport">عرض التقرير</button><button class="btn print" onclick="window.print()">طباعة</button></div><div id="reportOut"></div></div></section><section id="faults" class="hide"><div class="panel"><h2>شاشة الأعطال</h2><div id="faultAlert" class="openfault card">جاري تحميل الأعطال...</div><div id="faultList"></div></div></section><section id="maintenance" class="hide"><div class="panel"><h2>الصيانة</h2><button class="btn red no-print" data-go="faults">شاشة الأعطال</button><div class="range" style="margin-top:12px"><label>من<input id="ffrom" class="input" type="date"></label><label>إلى<input id="fto" class="input" type="date"></label></div><button class="btn no-print" id="faultReport">تقرير الأعطال</button><div id="faultReportOut"></div></div></section></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>(function(){'use strict';var cfg={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);var db=firebase.firestore(),ref=db.collection('acrowFactory5').doc('cleanV1');var state={machines:[],plan:{from:'',to:'',ids:[]},productions:[],faults:[],blockers:[]};var seed=[['1712','منشار RSA'],['982','متقاب/مثقاب'],['263','مثقاب'],['882','مثقاب'],['1522','Ledger/Ring'],['999','Ledger/Ring'],['5004','Ledger/Ring'],['5003','Ledger/Ring'],['1521','Ledger/Ring'],['998','Ledger/Ring'],['997','Ring Vertical'],['996','Ring Vertical'],['5006','Ring Vertical'],['5005','Cup Lock Vertical'],['450','Cup Lock Vertical'],['1524','Cup Lock Vertical'],['1523','Cup Lock Vertical'],['402','لحام يدوي'],['455','لحام يدوي'],['118','لحام يدوي'],['116','لحام يدوي'],['404','لحام يدوي'],['1502','منطقة الفرز']];function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function today(){return new Date().toISOString().slice(0,10)}function say(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}function save(){return ref.set(state)}function render(){pmachine.innerHTML=state.machines.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.id)+' — '+esc(m.name)+'</option>').join('');machineList.innerHTML=state.machines.map(m=>'<div class="card machine"><div><b>'+esc(m.id)+'</b> — '+esc(m.name)+'<div class="tag">'+esc(m.group||'')+'</div></div><button class="btn red no-print" data-del="'+esc(m.id)+'">حذف</button></div>').join('');dailyMachines.innerHTML=state.plan.ids.map(id=>{var m=state.machines.find(x=>x.id===id);return m?'<div class="card"><b>'+esc(m.id)+'</b><br>'+esc(m.name)+'</div>':''}).join('')||'<div class="card">لم يتم اختيار ماكينات للخطة.</div>';planMachines.innerHTML=state.machines.map(m=>'<label class="card"><input type="checkbox" data-plan="'+esc(m.id)+'" '+(state.plan.ids.includes(m.id)?'checked':'')+'> '+esc(m.id)+' — '+esc(m.name)+'</label>').join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=function(){state.machines=state.machines.filter(m=>m.id!==b.dataset.del);state.plan.ids=state.plan.ids.filter(x=>x!==b.dataset.del);save()});renderFaults()}function renderFaults(){var open=state.faults.filter(f=>!f.endTime);faultAlert.textContent=open.length?'يوجد '+open.length+' عطل جديد — برجاء إصلاح الماكينة':'لا توجد أعطال مفتوحة';faultAlert.className=open.length?'openfault card':'card';faultList.innerHTML=state.faults.map((f,i)=>'<div class="card '+(!f.endTime?'fault':'')+'"><b>ماكينة '+esc(f.machine)+'</b><div>'+esc(f.reason)+'</div><small>'+esc(f.date)+' — '+esc(f.time)+' — وردية '+esc(f.shift)+'</small><p>'+esc(f.details)+'</p>'+(!f.endTime?'<button class="btn green no-print" data-repair="'+i+'">تم إصلاح الماكينة</button>':'<b>تم الإصلاح: '+esc(f.endDate)+' '+esc(f.endTime)+'</b>')+'</div>').join('')||'<div class="card">لا توجد أعطال مسجلة.</div>';document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=function(){var f=state.faults[Number(b.dataset.repair)];if(!f.endTime){var d=new Date();f.endTime=d.toLocaleTimeString('ar-EG');f.endDate=today();f.status='تم الإصلاح';save();say('تم إصلاح الماكينة، شكرًا.')}})}function chart(rows,title){if(!rows.length)return '<div class="card">لا توجد بيانات في الفترة المختارة.</div>';var max=Math.max.apply(null,rows.map(x=>x.qty))||1;return '<h3>'+title+'</h3><div class="chart">'+rows.map(x=>'<div><b>'+esc(x.name)+'</b> — '+x.qty+'</div><div class="bar" style="width:'+Math.max(2,x.qty/max*100)+'%"><span>'+x.qty+'</span></div>').join('')+'</div>'}function runReport(){var a=rfrom.value,b=rto.value,sh=rshift.value;var rows={};state.productions.filter(p=>(!a||p.date>=a)&&(!b||p.date<=b)&&(sh==='all'||p.shift===sh)).forEach(p=>{var k=p.product||'غير محدد';rows[k]=(rows[k]||0)+Number(p.qty||0)});var arr=Object.keys(rows).map(k=>({name:k,qty:rows[k]})).sort((x,y)=>y.qty-x.qty);var total=arr.reduce((s,x)=>s+x.qty,0);reportOut.innerHTML='<div class="card"><b>الفترة:</b> '+(a||'أول تسجيل')+' إلى '+(b||'آخر تسجيل')+'<br><b>الإجمالي:</b> '+total+'</div>'+chart(arr,'تجميع المنتجات')+'<h3>Pareto</h3>'+chart(arr.map((x,i)=>({name:(i+1)+'. '+x.name,qty:x.qty})).slice(0,10),'ترتيب Pareto');}function runFaultReport(){var a=ffrom.value,b=fto.value;var rows={};state.faults.filter(f=>(!a||f.date>=a)&&(!b||f.date<=b)).forEach(f=>{var k=f.reason||'عطل';rows[k]=(rows[k]||0)+1});var arr=Object.keys(rows).map(k=>({name:k,qty:rows[k]})).sort((x,y)=>y.qty-x.qty);faultReportOut.innerHTML=chart(arr,'تقرير الأعطال حسب الفترة')+'<div class="card">من '+(a||'البداية')+' إلى '+(b||'النهاية')+'</div>'}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=function(){document.querySelectorAll('main,section').forEach(x=>x.classList.add('hide'));document.getElementById(b.dataset.go).classList.remove('hide');window.scrollTo(0,0)});pdate.value=today();rfrom.value=today();rto.value=today();ffrom.value=today();fto.value=today();addMachine.onclick=function(){var id=mid.value.trim(),name=mname.value.trim();if(!id||!name)return alert('اكتب رقم واسم الماكينة');if(state.machines.some(m=>m.id===id))return alert('رقم الماكينة موجود');state.machines.push({id:id,name:name,group:mgroup.value.trim()});mid.value='';mname.value='';mgroup.value='';save()};saveProd.onclick=function(){if(!pmachine.value||!pproduct.value||!pqty.value)return alert('أكمل بيانات الإنتاج');state.productions.push({date:pdate.value||today(),shift:pshift.value,machine:pmachine.value,product:pproduct.value.trim(),qty:Number(pqty.value)});save();pqty.value=''};newFault.onclick=function(){var reason=prompt('نوع العطل؟');if(!reason)return;var d=new Date();state.faults.push({date:today(),time:d.toLocaleTimeString('ar-EG'),shift:pshift.value,machine:pmachine.value,reason:reason,details:prompt('تفاصيل العطل؟')||'',status:'مفتوح'});save();say('يوجد عطل جديد، برجاء إصلاح الماكينة')};newBlock.onclick=function(){var reason=prompt('نوع معوق الإنتاج؟');if(!reason)return;var d=new Date();state.blockers.push({date:today(),time:d.toLocaleTimeString('ar-EG'),shift:pshift.value,machine:pmachine.value,reason:reason,details:prompt('تفاصيل المعوق؟')||''});save()};unlockPlan.onclick=function(){if(planPass.value!=='2026'){return alert('كلمة السر غير صحيحة')}planBody.classList.remove('hide');planFrom.value=state.plan.from||today();planTo.value=state.plan.to||today()};savePlan.onclick=function(){state.plan.from=planFrom.value;state.plan.to=planTo.value;state.plan.ids=[...document.querySelectorAll('[data-plan]:checked')].map(x=>x.dataset.plan);save()};document.addEventListener('change',function(e){if(e.target.matches('[data-plan]')){state.plan.ids=[...document.querySelectorAll('[data-plan]:checked')].map(x=>x.dataset.plan);save()}});runReport.onclick=runReport;faultReport.onclick=runFaultReport;ref.onSnapshot(function(s){if(s.exists){state=s.data()||state}else{state.machines=seed.map(x=>({id:x[0],name:x[1],group:x[1]}));save()}render()},function(e){console.error(e);alert('تعذر الاتصال بالبيانات المشتركة: '+e.message)});})();</script></body></html>
