<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة الأعطال — ACROW Factory 5</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#081a2f;--card:#102a45;--line:#285477;--text:#fff;--dim:#b7c7d6;--red:#ef4444;--green:#16a34a;--blue:#0879d1;--yellow:#facc15}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Arial,sans-serif;padding:16px}header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:28px;font-weight:900}header p{margin:4px 0;color:var(--dim)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font-family:inherit;font-weight:900;border:1px solid var(--line);border-radius:9px;padding:11px 16px;cursor:pointer;background:var(--blue);color:#fff}.sound.on{background:var(--green)}.status{max-width:1200px;margin:12px auto;color:var(--dim);font-size:14px}.new{max-width:1200px;margin:14px auto;background:#7f1d1d;border:2px solid var(--red);border-radius:13px;padding:16px;text-align:center;font-size:21px;font-weight:900;display:none}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}.card{background:var(--card);border:2px solid var(--red);border-radius:14px;padding:16px;box-shadow:0 8px 25px rgba(0,0,0,.22)}.machine{font-size:22px;font-weight:900}.meta{color:var(--dim);font-size:14px;margin:5px 0 12px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.label{color:var(--dim);white-space:nowrap}.value{font-weight:800;text-align:left;overflow-wrap:anywhere}.photo{margin-top:13px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#061323}.photo img{display:block;width:100%;max-height:360px;object-fit:contain;cursor:pointer}.photo p{text-align:center;color:var(--dim);margin:8px}.repair{width:100%;margin-top:13px;background:var(--green);border-color:var(--green);font-size:18px}.repair:disabled,.save:disabled,.sound:disabled{opacity:.65;cursor:wait}.empty{max-width:1200px;margin:60px auto;text-align:center;color:var(--dim);font-size:20px}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--green);padding:24px 38px;border-radius:15px;font-weight:900;font-size:26px;display:none;z-index:9999;box-shadow:0 12px 35px rgba(0,0,0,.5)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}.modal img{max-width:95vw;max-height:90vh;border-radius:12px}.modal button{position:absolute;top:18px;left:18px;background:var(--red);font-size:18px}@media(max-width:600px){body{padding:10px}h1{font-size:23px}.grid{grid-template-columns:1fr}.new{font-size:18px}}</style></head><body><header><div><h1>شاشة الأعطال</h1><p>شاشة مستقلة — نفس بيانات الأعطال المشتركة مع البرنامج لحظة بلحظة</p></div><div class="actions"><button id="sound" class="sound">تفعيل الصوت</button><button id="refresh">تحديث</button></div></header><div id="status" class="status">جاري الاتصال بالبيانات...</div><div id="new" class="new">يوجد عطل جديد، رجاء الإصلاح</div><main id="grid" class="grid"></main><div id="toast" class="toast">تم إصلاح العطل، شكرًا</div><div id="modal" class="modal"><button id="closeModal">إغلاق</button><img id="modalImg" alt="صورة العطل"></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const cfg={apiKey:'AIzaSyCGUyuOU0q-Zg5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);const db=firebase.firestore(),ref=db.collection('acrowFactory5').doc('store');let store={records:{}},known={},baseline=true,audioCtx=null,soundEnabled=false,working=false,lastUpdate=null;const grid=document.getElementById('grid'),banner=document.getElementById('new'),toast=document.getElementById('toast'),status=document.getElementById('status');function unlock(){try{const C=window.AudioContext||window.webkitAudioContext;if(C){audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume()}}catch(e){}}function enableSound(){unlock();soundEnabled=true;try{localStorage.setItem('acrowFaultSound','1')}catch(e){}document.getElementById('sound').textContent='الصوت مفعل';document.getElementById('sound').classList.add('on');speak('تم تفعيل صوت شاشة الأعطال')}function speak(t){if(!soundEnabled)return;try{unlock();if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.volume=1;u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}}catch(e){}}function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function parseKey(k){const p=String(k).split('_');if(p.length<3)return{date:k,sh:'',id:''};return{date:p.slice(0,-2).join('_'),sh:p[p.length-2],id:p[p.length-1]}}function allRows(){const a=[];Object.entries(store.records||{}).forEach(([k,r])=>{if(!r)return;const p=parseKey(k);(r.faults||[]).forEach((f,i)=>{if(f&&!f.endTime)a.push({key:k+'#'+i,k,index:i,date:p.date,sh:p.sh,id:p.id,f:f,r:r})})});return a}function find(key){return allRows().find(x=>x.key===key)}function duration(start){if(!start)return '—';const m=String(start).match(/(\d{1,2}):(\d{2})/);if(!m)return '—';let s=Number(m[1])*60+Number(m[2]),n=new Date(),e=n.getHours()*60+n.getMinutes();let d=e-s;if(d<0)d+=1440;return d+' دقيقة'}function render(){const rs=allRows();banner.style.display=rs.length?'block':'none';status.textContent='متصل بالبيانات المشتركة — آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');grid.innerHTML=rs.length?rs.map(x=>`<div class="card"><div class="machine">ماكينة ${esc(x.id)}</div><div class="meta">التاريخ: ${esc(x.date)} — الوردية: ${esc(x.sh==='1'?'الأولى':x.sh==='2'?'الثانية':x.sh||'—')}</div><div class="row"><span class="label">نوع العطل</span><span class="value">${esc(x.f.reason||x.f.type||'غير محدد')}</span></div><div class="row"><span class="label">وقت البداية</span><span class="value">${esc(x.f.startTime||'—')}</span></div><div class="row"><span class="label">مدة العطل</span><span class="value">${esc(duration(x.f.startTime))}</span></div><div class="row"><span class="label">الوصف</span><span class="value">${esc(x.f.description||x.f.details||x.f.note||'بدون وصف')}</span></div>${x.f.photo?`<div class="photo"><img src="${esc(x.f.photo)}" data-photo="${esc(x.key)}" alt="صورة العطل"><p>اضغط على الصورة للتكبير</p></div>`:''}<button class="repair" data-repair="${esc(x.key)}">تم الإصلاح</button></div>`).join(''):'<div class="empty">لا توجد أعطال مفتوحة حاليًا</div>';document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=repair);document.querySelectorAll('[data-photo]').forEach(img=>img.onclick=()=>{document.getElementById('modalImg').src=img.src;document.getElementById('modal').style.display='flex'});setTimeout(renderDuration,1000)}function renderDuration(){if(allRows().length)render()}async function repair(e){if(working)return;unlock();const b=e.currentTarget,x=find(b.dataset.repair);if(!x)return;working=true;b.disabled=true;b.textContent='جارٍ تسجيل الإصلاح...';const end=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});const old={endTime:x.f.endTime,repairedAt:x.f.repairedAt,mins:x.f.mins};x.f.endTime=end;x.f.repairedAt=end;x.f.mins=calc(x.f.startTime,end);try{await ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});toast.style.display='block';setTimeout(()=>toast.style.display='none',1800);speak('تم إصلاح العطل، شكرًا')}catch(err){x.f.endTime=old.endTime;x.f.repairedAt=old.repairedAt;x.f.mins=old.mins;alert('تعذر تسجيل الإصلاح، حاول مرة أخرى')}finally{working=false;render()}}function calc(a,b){if(!a||!b)return 0;let A=a.match(/(\d{1,2}):(\d{2})/),B=b.match(/(\d{1,2}):(\d{2})/);if(!A||!B)return 0;let d=(+B[1]*60+ +B[2])-(+A[1]*60+ +A[2]);return d<0?d+1440:d}function check(){const rs=allRows(),cur={};rs.forEach(x=>cur[x.key]=1);if(baseline){Object.keys(cur).forEach(k=>known[k]=1);baseline=false}else Object.keys(cur).forEach(k=>{if(!known[k]){known[k]=1;banner.style.display='block';speak('يوجد عطل جديد، رجاء الإصلاح')}});Object.keys(known).forEach(k=>{if(!cur[k])delete known[k]});render()}document.getElementById('sound').onclick=enableSound;document.getElementById('refresh').onclick=()=>{unlock();render()};document.getElementById('closeModal').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.style.display='none'};try{if(localStorage.getItem('acrowFaultSound')==='1'){soundEnabled=true;document.getElementById('sound').textContent='الصوت مفعل';document.getElementById('sound').classList.add('on')}}catch(e){}ref.onSnapshot(s=>{if(s.exists&&s.data()&&s.data().data){store=s.data().data;lastUpdate=new Date();check()}else{status.textContent='لا توجد بيانات مشتركة';render()}},e=>{status.textContent='تعذر الاتصال بالبيانات المشتركة';console.error(e)});setInterval(()=>{if(allRows().length)render()},60000);</script></body></html>
