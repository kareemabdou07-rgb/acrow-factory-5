# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare clean ACROW v207 site
        shell: python
        run: |
          from pathlib import Path
          import shutil, re
          site=Path('_site')
          if site.exists(): shutil.rmtree(site)
          shutil.copytree('.', site, ignore=shutil.ignore_patterns('.git','_site'))
          p=site/'index.html'
          s=p.read_text(encoding='utf-8')
          files=['v198-cloud-sync.js','v199-realtime.js','v201-live-production.js','v202-live-production-fix.js','v203-production-input-fix.js','v204-all-machines-sync.js','v205-production-save-button.js','v206-production-fix.js','v207-production-stable-fix.js']
          for f in files:
              s=re.sub(r'\s*<script[^>]+src=["\']\./'+re.escape(f)+r'["\'][^>]*></script>','',s,flags=re.I)
          s=re.sub(r'\s*<!--\s*v205-clean-realtime-loaders\s*-->','',s,flags=re.I)
          block='\n<script src="./v198-cloud-sync.js"></script>\n<script src="./v207-production-stable-fix.js"></script>\n'
          pos=s.lower().rfind('</body>')
          if pos>=0: s=s[:pos]+block+s[pos:]
          else: s=s.rstrip()+block
          p.write_text(s,encoding='utf-8')
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
