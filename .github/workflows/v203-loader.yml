name: Activate v203 production input fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace production loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<!-- v202-live-production-loader -->\n<script src="./v202-live-production-fix.js"></script>'
          new='<!-- v203-production-input-loader -->\n<script src="./v203-production-input-fix.js"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('Expected v202 loader not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activate v203 production input fix"
          git pull --rebase origin main
          git push origin HEAD:main
