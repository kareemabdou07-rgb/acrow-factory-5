<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة الأعطال والصيانة — ACROW Factory 5</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#071827;--card:#102a45;--line:#285477;--text:#fff;--dim:#a9bac9;--red:#ef4444;--green:#16a34a;--blue:#0879d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Arial,sans-serif;padding:16px}header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:28px}header p{margin:4px 0;color:var(--dim)}button{font-family:inherit;font-weight:800;border:1px solid var(--line);border-radius:9px;padding:10px 15px;cursor:pointer;background:var(--blue);color:#fff}.new{max-width:1200px;margin:16px auto;background:#7f1d1d;border:2px solid var(--red);border-radius:12px;padding:14px;text-align:center;font-size:20px;font-weight:900;display:none}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.card{background:var(--card);border:2px solid var(--red);border-radius:14px;padding:16px}.machine{font-size:21px;font-weight:900}.meta{color:var(--dim);font-size:14px;margin:4px 0 12px}.photo{width:100%;max-height:330px;object-fit:contain;background:#061323;border:1px solid var(--line);border-radius:10px;margin:4px 0 14px;display:none}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.label{color:var(--dim)}.value{font-weight:800;text-align:left}.time{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.time input{background:#061323;color:#fff;border:1px solid var(--line);border-radius:7px;padding:8px}.save{background:var(--blue)}.repair{width:100%;margin-top:12px;background:var(--green);border-color:var(--green);font-size:17px}.empty{max-width:1200px;margin:40px auto;text-align:center;color:var(--dim);font-size:18px}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--green);padding:22px 34px;border-radius:14px;font-weight:900;font-size:24px;display:none;z-index:9999;box-shadow:0 12px 35px rgba(0,0,0,.45)}</style></head><body><header><div><h1>شاشة الأعطال والصيانة</h1><p>متابعة الأعطال الجديدة والإصلاح لحظة بلحظة — مع صورة العطل</p></div><button id="refresh">تحديث</button></header><div id="new" class="new">يوجد عطل جديد على الشاشة، برجاء إصلاح العطل.</div><div id="syncStatus" style="max-width:1200px;margin:12px auto;padding:10px 14px;border:1px solid #285477;border-radius:9px;background:#102a45;color:#fff;font-weight:800">جارٍ الاتصال ببيانات المصنع السحابية…</div><main id="grid" class="grid"></main><div id="toast" class="toast">تم إصلاح العطل</div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const cfg={apiKey:'AIzaSyCGUyuOU-qG-Z5A1LnnH6oIcbJSwgwS9oc',authDomain:'acrow-factory-5.firebaseapp.com',projectId:'acrow-factory-5',storageBucket:'acrow-factory-5.firebasestorage.app',messagingSenderId:'26128829420',appId:'1:26128829420:web:75e6a0f31edc7e66c44ec9'};firebase.initializeApp(cfg);const db=firebase.firestore(),ref=db.collection('acrowFactory5').doc('store');let store={records:{}},known={},baseline=true,audioCtx=null,speechReady=false;const grid=document.getElementById('grid'),banner=document.getElementById('new'),toast=document.getElementById('toast');function unlock(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();speechReady=true}catch(e){}}function speak(t){unlock();try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.volume=1;u.rate=.9;u.pitch=1;u.onend=()=>{};speechSynthesis.speak(u)}catch(e){}}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function photoOf(f){return f.photo||f.image||f.imageUrl||f.photoUrl||f.faultPhoto||f.faultImage||''}function unwrapStore(doc){if(!doc||typeof doc!=='object')return null;const candidates=[doc.data,doc.store,doc.data&&doc.data.store,doc.data&&doc.data.data,doc];for(const x of candidates){if(x&&x.records&&typeof x.records==='object')return x;}return null}function openRows(){let a=[];Object.entries(store.records||{}).forEach(([k,r])=>{if(!r||typeof r!=='object')return;let p=k.split('_');if(p.length<3)return;let sh=String(p[p.length-2]),id=String(p[p.length-1]),date=p.slice(0,-2).join('_');(Array.isArray(r.faults)?r.faults:[]).forEach((f,i)=>{if(f&&!(String(f.endTime||'').trim()))a.push({key:k+'_'+i,k,date,sh,id,f,r})})});return a}function find(key){return openRows().find(x=>x.key===key)}function render(){let rs=openRows();banner.style.display=rs.length?'block':'none';let allRecords=Object.values(store.records||{}),totalFaults=allRecords.reduce((n,r)=>n+(Array.isArray(r&&r.faults)?r.faults.length:0),0);let status=document.getElementById('syncStatus');if(status&&!status.dataset.error)status.textContent='متصل بالسحابة — سجلات: '+allRecords.length+' — إجمالي الأعطال المسجلة: '+totalFaults+' — الأعطال المفتوحة: '+rs.length;grid.innerHTML=rs.length?rs.map(x=>{let p=photoOf(x.f);return `<div class="card"><div class="machine">ماكينة ${esc(x.id)}</div><div class="meta">التاريخ: ${esc(x.date)} — الوردية: ${esc(x.sh==='1'?'الأولى':'الثانية')}</div>${p?`<img class="photo" style="display:block" src="${esc(p)}" alt="صورة العطل">`:''}<div class="row"><span class="label">نوع العطل</span><span class="value">${esc(x.f.reason||'غير محدد')}</span></div><div class="row"><span class="label">وقت البداية</span><span class="value">${esc(x.f.startTime||'—')}</span></div><div class="row"><span class="label">الوصف</span><span class="value">${esc(x.f.description||'بدون وصف')}</span></div><div class="time">تعديل البداية <input type="time" data-start="${esc(x.key)}" value="${esc(x.f.startTime||'')}"><button class="save" data-save="${esc(x.key)}">حفظ الوقت</button></div><button class="repair" data-repair="${esc(x.key)}">تم الإصلاح</button></div>`}).join(''):'<div class="empty">لا توجد أعطال مفتوحة حاليًا</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let x=find(b.dataset.save),i=document.querySelector(`[data-start="${CSS.escape(b.dataset.save)}"]`);if(!x||!i)return;x.f.startTime=i.value||x.f.startTime;save()});document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=async()=>{unlock();let x=find(b.dataset.repair);if(!x)return;let end=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});x.f.endTime=end;x.f.repairedAt=end;x.f.mins=calc(x.f.startTime,end);b.disabled=true;b.textContent='جارٍ تسجيل الإصلاح...';try{await ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});render();toast.style.display='block';speak('تم إصلاح العطل');setTimeout(()=>toast.style.display='none',2500)}catch(e){b.disabled=false;b.textContent='تم الإصلاح';alert('تعذر تسجيل الإصلاح، حاول مرة أخرى')}})}function calc(a,b){if(!a||!b)return 0;let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number),d=(bh*60+bm)-(ah*60+am);return d<0?d+1440:d}function save(){ref.set({data:store,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(render).catch(()=>alert('تعذر حفظ البيانات'))}function check(){let rs=openRows(),cur={};rs.forEach(x=>cur[x.key]=1);if(!baseline){Object.keys(cur).forEach(k=>{if(!known[k]){known[k]=1;speak('يوجد عطل جديد على الشاشة، برجاء إصلاح العطل')}})}else{Object.keys(cur).forEach(k=>known[k]=1);baseline=false}Object.keys(known).forEach(k=>{if(!cur[k])delete known[k]});render()}ref.onSnapshot(s=>{try{let doc=s.exists&&s.data()?s.data():null;let incoming=unwrapStore(doc);if(incoming&&incoming.records&&typeof incoming.records==='object'){store=incoming;let st=document.getElementById('syncStatus');if(st){st.dataset.error='';st.style.borderColor='#16a34a';st.textContent='تم الاتصال بالسحابة واستلام بيانات المصنع';}check();}else{store={records:{}};let st=document.getElementById('syncStatus');if(st){st.dataset.error='';st.style.borderColor='#f59e0b';st.textContent='متصل بالسحابة، لكن مستند البيانات لا يحتوي على سجلات أعطال بالشكل المتوقع. لا تغلق الشاشة؛ راجع حفظ العطل من البرنامج الأساسي.';}render();}}catch(err){console.error('Fault screen data parse failed',err);let st=document.getElementById('syncStatus');if(st){st.dataset.error='1';st.style.borderColor='#ef4444';st.textContent='خطأ في قراءة بيانات الأعطال؛ راجع الاتصال أو افتح الشاشة من جديد.';}}},e=>{console.error('Fault screen Firebase listener failed',e);let st=document.getElementById('syncStatus');if(st){st.dataset.error='1';st.style.borderColor='#ef4444';st.textContent='فشل الاتصال ببيانات المصنع: '+(e&&e.code?e.code:'تحقق من اتصال الإنترنت وصلاحية السحابة');}});document.getElementById('refresh').onclick=async()=>{unlock();let st=document.getElementById('syncStatus');if(st){st.dataset.error='';st.textContent='جارٍ تحديث بيانات الأعطال من السحابة…';}try{const snap=await ref.get({source:'server'});const doc=snap.exists?snap.data():null;const incoming=unwrapStore(doc);if(incoming&&incoming.records&&typeof incoming.records==='object'){store=incoming;if(st){st.style.borderColor='#16a34a';st.textContent='تم تحديث شاشة الأعطال من السحابة';}check();}else if(st){st.dataset.error='1';st.style.borderColor='#f59e0b';st.textContent='اتصلت الشاشة بالسحابة، لكن لم تجد سجلات المصنع داخل مستند البيانات.';render();}}catch(e){console.error('Fault screen manual refresh failed',e);if(st){st.dataset.error='1';st.style.borderColor='#ef4444';st.textContent='فشل تحديث شاشة الأعطال من السحابة: '+(e&&e.code?e.code:'تحقق من الإنترنت');}}};document.addEventListener('click',()=>{unlock()},{once:true});</script></body></html>
