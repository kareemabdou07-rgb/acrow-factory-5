name: Fix ACROW login button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<button type="button" id="enterSystemBtn" onclick="(function(){var s=document.getElementById('acrowSplash');if(s){s.classList.add('hidden');s.style.display='none';}document.body.classList.remove('splash-open');})();">اضغط للدخول</button>'''
          new='''<button type="button" id="enterSystemBtn" style="position:relative;z-index:100000;pointer-events:auto!important;touch-action:manipulation!important;" onclick="event.preventDefault();event.stopPropagation();var s=document.getElementById('acrowSplash');if(s){s.classList.add('hidden');s.setAttribute('aria-hidden','true');s.style.setProperty('display','none','important');s.style.setProperty('visibility','hidden','important');s.style.setProperty('pointer-events','none','important');s.style.setProperty('z-index','-1','important');}document.body.classList.remove('splash-open');document.body.style.setProperty('overflow','auto','important');return false;">اضغط للدخول</button>'''
          if old in s:
              s=s.replace(old,new,1)
          else:
              s=s.replace('id="enterSystemBtn"','id="enterSystemBtn" style="position:relative;z-index:100000;pointer-events:auto!important;touch-action:manipulation!important;"',1)
          marker='</head>'
          css='''<style id="acrow-login-final-fix">#enterSystemBtn{position:relative!important;z-index:100000!important;pointer-events:auto!important;touch-action:manipulation!important;cursor:pointer!important;}#acrowSplash{z-index:99999!important;}#acrowSplash.hidden{display:none!important;}</style>\n'''
          if 'acrow-login-final-fix' not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-login.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-login.yml
          git commit -m "Fix ACROW login button" || exit 0
          git push
