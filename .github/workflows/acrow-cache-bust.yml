name: ACROW Factory 5 cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update production-fix cache version
        run: |
          if grep -q 'production-fix-v14.js' index.html; then
            exit 0
          fi
          sed -i 's#production-fix.js?v=13#production-fix-v14.js#g' index.html
          sed -i 's#production-fix-v13.js#production-fix-v14.js#g' index.html
          sed -i 's#production-fix.js#production-fix-v14.js#g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'ACROW Factory 5 v14 cache bust'
          git push
