<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACROW Factory 5</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="app" src="./index.html?v=168"></iframe>
<script>
(function(){
  var frame=document.getElementById('app');
  function repair(){
    try{
      var d=frame.contentDocument;
      if(!d)return;
      var s=d.getElementById('acrowSplash');
      var b=d.getElementById('enterSystemBtn')||d.getElementById('enterBtn')||d.getElementById('loginBtn')||d.getElementById('splashEnterBtn');
      function openApp(e){
        if(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();}
        if(s){s.style.setProperty('display','none','important');s.style.setProperty('visibility','hidden','important');s.style.setProperty('opacity','0','important');s.style.setProperty('pointer-events','none','important');s.style.setProperty('z-index','-1','important');}
        d.body.classList.add('entry168-open');
        d.body.style.setProperty('overflow','auto','important');
        ['.topbar','.container','#summaryStrip','#departments'].forEach(function(sel){var x=d.querySelector(sel);if(x){x.style.setProperty('display','block','important');x.style.setProperty('visibility','visible','important');x.style.setProperty('opacity','1','important');}});
        try{if(typeof d.defaultView.render==='function')d.defaultView.render();}catch(x){}
      }
      if(b){b.onclick=openApp;b.disabled=false;b.removeAttribute('disabled');b.style.setProperty('pointer-events','auto','important');if(!b.dataset.entry168){b.dataset.entry168='1';b.addEventListener('click',openApp,true);b.addEventListener('touchend',openApp,true);}}
      if(d.body.classList.contains('entry168-open')&&s){s.style.setProperty('display','none','important');s.style.setProperty('visibility','hidden','important');s.style.setProperty('pointer-events','none','important');}
    }catch(e){}
  }
  frame.addEventListener('load',repair);
  setInterval(repair,250);
})();
</script>
</body>
</html>
