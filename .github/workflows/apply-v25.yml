name: Apply ACROW Factory v25
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject v25
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./production-obstacles-v25.js"></script>'
          if tag not in s:
              marker='<script src="./production-obstacles-v24.js"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag)
              else:
                  s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v25 activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Activate ACROW Factory v25 obstacle buttons and report'
          git push
