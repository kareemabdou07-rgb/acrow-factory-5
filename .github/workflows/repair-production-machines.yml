name: Repair daily production machine cards

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject machine-card repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script id="acrow-production-machine-cards-repair-v5">'
          if marker not in s:
              js=r'''<script id="acrow-production-machine-cards-repair-v5">
          (function(){
            var known=[
              ['1712','منشار RSA'],['982','متقاب/مثقاب'],['961','متقاب'],['263','مثقاب'],['882','مثقاب'],
              ['1522','Ledgers/Ring'],['999','Ledgers/Ring'],['5004','Ledgers/Ring'],['5003','Ledgers/Ring'],['1521','Ledgers/Ring'],['998','Ledgers/Ring'],
              ['997','Ring Vertical'],['996','Ring Vertical'],['5006','Ring Vertical'],['5005','Cup Lock Vertical'],['450','Cup Lock Vertical'],['1524','Cup Lock Vertical'],['1523','Cup Lock Vertical'],
              ['5008','فوله اوتوماتيك'],['402','Hand welding'],['455','Hand welding'],['118','Hand welding'],['116','Hand welding'],['404','Hand welding'],
              ['1502','منطقة الفرز'],['279','مكبس'],['225','مكبس'],['956','مكبس'],['284','مكبس'],['1107','مكبس تخريم'],['1324','مكبس تشكيل'],
              ['1313','مكنه تشكيل'],['1320','مكنه تشكيل'],['147','مكنه تشكيل'],['986','متقاب'],['1306','متقاب'],['963','متقاب'],['1317','متقاب'],['1318','متقاب'],['964','متقاب'],
              ['954','منشار'],['1713','متقاب متعدد'],['112','فريم كوباية'],['114','فريم كوباية'],['477','فارمه يدوي'],['1504','فارمه يدوي'],['712','فارمه يدوي'],['710','فارمه يدوي'],['122','فارمه يدوي'],['454','فارمه يدوي'],['713','فارمه يدوي'],['115','فارمه يدوي'],['117','فارمه يدوي'],['711','فارمه يدوي'],['456','فارمه يدوي'],['1501','ماكينه يدوي'],['120','ماكينه يدوي']
            ];
            function sync(){
              try{
                if(!window.store)return false;
                if(!Array.isArray(window.MACHINES))window.MACHINES=[];
                var by={};
                window.MACHINES.forEach(function(m){if(m&&m.id!=null)by[String(m.id)]=m;});
                function add(id,name){
                  id=String(id); if(by[id])return;
                  var m={id:id,name:name,dept:'sorting',deptName:'sorting',target:0};
                  window.MACHINES.push(m);by[id]=m;
                }
                known.forEach(function(k){add(k[0],k[1]);});
                (Array.isArray(store.machines)?store.machines:[]).forEach(function(m){var id=String(m.number||m.code||m.id||m.machine||'').trim();if(id&&!by[id])add(id,String(m.name||m.type||m.machineName||id));});
                if(!Array.isArray(store.machines))store.machines=[];
                var seen={};store.machines.forEach(function(m){seen[String(m.number||m.code||m.id||m.machine||'')]=1;});
                known.forEach(function(k){if(!seen[k[0]])store.machines.push({number:k[0],name:k[1],zone:'منطقة 1'});});
                if(Array.isArray(store.machineCustom))store.machineCustom.forEach(function(m){var id=String(m.id||m.code||m.number||'');if(id&&!seen[id]){store.machines.push(m);seen[id]=1;}});
                var ids=window.MACHINES.map(function(m){return String(m.id);}).filter(Boolean);
                if(Array.isArray(store.favorites))store.favorites=Array.from(new Set(store.favorites.concat(ids)));
                else store.favorites=ids.slice();
                try{if(typeof saveStore==='function')saveStore();}catch(e){}
                try{if(typeof rebuildMachines==='function')rebuildMachines();}catch(e){}
                return true;
              }catch(e){return false;}
            }
            function renderNow(){
              sync();
              try{if(typeof window.renderMachineSelectList==='function')window.renderMachineSelectList();}catch(e){}
              try{if(typeof window.render==='function')window.render();}catch(e){}
            }
            function boot(){renderNow();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
            setTimeout(renderNow,100);setTimeout(renderNow,500);setTimeout(renderNow,1500);setTimeout(renderNow,3000);
            setInterval(renderNow,5000);
          })();
          </script>'''
              s=s.replace('</head>',js+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy repaired Pages
        id: deployment
        uses: actions/deploy-pages@v5
